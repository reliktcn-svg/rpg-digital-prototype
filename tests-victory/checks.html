<!doctype html><meta charset="utf-8"><title>Victory regression</title><style>body{background:#191b1a;color:#fff;font:14px system-ui}iframe{width:390px;height:844px}pre{white-space:pre-wrap}</style><h1>Victory regression</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{let w,d,D,A,P,s,p,c;const results=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(x,m='assertion')=>{if(!x)throw Error(m)};
async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
async function fresh({hero='warrior',rank='Обычный',xp=150,boss=false}={}){await new Promise(r=>{game.onload=r;game.src='../index.html?victory-tests='+Math.random()});w=game.contentWindow;d=w.document;D=w.__RPG_DEBUG__;A=w.__RPG_ONLINE__;P=w.RPGProgression;await w.RPGAtlas.ready;d.getElementById('netLocal').click();A.startWithHeroes([hero]);s=D.getState();p=D.currentPlayer();p.masteryPoints=xp;w.__testRandomOriginal=w.Math.random;w.Math.random=()=>.49;const e=boss?D.CARD_BY_ID[281]:Object.values(D.CARD_BY_ID).find(e=>e.category==='Враг'&&e.fields?.['Ранг']?.toLowerCase()===rank.toLowerCase());check(e,'enemy '+rank);D.combatStart(e);c=s.combat;if(boss)c.isBoss=true;c.enemyHp=0;return e}
function click(){const b=d.getElementById('rollPopupClose');b.disabled=false;b.click()}
function text(){return d.getElementById('rollPopupDetail').textContent}
await test('Victory first, no automatic roll or loot draw; level notice starts at 1s and closes after 3s',async()=>{await fresh();const deck=JSON.stringify(s.decks.lootOuter);D.combatVictory();check(c.victory.searchState==='pending');check(c.victory.searchRoll==null);check(JSON.stringify(s.decks.lootOuter)===deck,'premature loot draw');check(d.getElementById('rollPopupClose').textContent==='Тщательный поиск');check(!d.getElementById('rollOverlay').hidden);check(text().includes('Найдено тайников: 1'));await wait(700);check(!d.getElementById('victoryLevelUp'),'too early');await wait(450);check(d.getElementById('victoryLevelUp')?.textContent.includes('2 уровень'));await wait(1500);check(d.getElementById('victoryLevelUp'),'closed too early');await wait(1550);check(!d.getElementById('victoryLevelUp'),'did not close');check(!d.getElementById('rollOverlay').hidden,'victory closed');});
for(const [roll,count,keep] of [[5,1,1],[15,2,1],[20,3,2]])await test('Search D20='+roll+' opens '+count+' and keeps '+keep+'; repeated click cannot reroll',async()=>{await fresh({xp:0});D.combatVictory();const gold=p.gold,xp=p.masteryPoints;w.Math.random=()=>(roll-.5)/20;click();check(c.victory.searchRoll===roll);check(c.victory.lootDraft.candidates.length===count);check(c.victory.lootDraft.keep===keep);const snapshot=JSON.stringify(c.victory);D.performVictorySearch(p,c);check(JSON.stringify(c.victory)===snapshot);click();check(c.victory.searchState==='done');check(text().includes('Можно открыть карт тайников: '+count));check(text().includes('Выбрать наград: '+keep));check(p.gold===gold&&p.masteryPoints===xp);check(c.victoryTurnPassed);click();check(d.querySelector('#lootDraftConfirm'));const buttons=[...d.querySelectorAll('[data-loot-choice]')];for(let i=0;i<keep;i++)buttons[i].click();d.querySelector('#lootDraftConfirm').click();check(c.victory.lootDraft.confirmed,'loot not received')});
await test('Natural 1 resolves injury after explicit search and retains base loot',async()=>{await fresh({xp:0});D.combatVictory();const hp=p.currentHp;w.Math.random=()=>0;click();check(c.victory.searchRoll===1&&p.currentHp===hp);click();check(d.getElementById('rollPopupTitle').textContent.includes('урон'));click();check(p.currentHp===hp-1);check(c.victory.searchState==='done'&&c.victory.lootDraft.keep===1);check(text().includes('Получено 1 урона'));});
await test('Lethal search injury returns undelivered loot and handles death',async()=>{await fresh({xp:0});p.currentHp=1;D.combatVictory();w.Math.random=()=>0;click();click();click();check(p.currentHp===0);check(!c.victoryTurnPassed);click();check(s.combat===null);});
await test('Weak enemy has no search; no level notification without a new level',async()=>{await fresh({rank:'Слабый',xp:0});D.combatVictory();check(d.getElementById('rollPopupClose').textContent==='К наградам');check(text().includes('без Тщательного поиска'));await wait(1200);check(!d.getElementById('victoryLevelUp'));check(!c.levelUp);});
await test('Final boss also opens victory with level up and final completion',async()=>{await fresh({boss:true,xp:0});D.combatVictory();check(d.getElementById('rollPopupClose').textContent==='Завершить партию');await wait(1100);check(d.getElementById('victoryLevelUp')?.textContent.includes('3 уровень'));click();check(s.gameOver?.winnerId===p.id);check(!d.getElementById('victoryLevelUp'));});
await test('Pending search survives exported saved combat and can be resumed',async()=>{await fresh({xp:0});D.combatVictory();const saved=JSON.parse(JSON.stringify(A.exportState()));A.applyState(saved);s=D.getState();c=s.combat;p=D.currentPlayer();check(c.victory.searchState==='pending'&&c.victory.searchRoll==null);click();check(c.victory.searchState==='rolling','saved callback used old combat');});
await test('Search damage survives state refresh and is applied only once',async()=>{await fresh({xp:0});D.combatVictory();w.Math.random=()=>0;click();const saved=JSON.parse(JSON.stringify(A.exportState()));A.applyState(saved);s=D.getState();p=D.currentPlayer();c=s.combat;const hp=p.currentHp;click();click();check(p.currentHp===hp-1&&c.victory.searchDamageApplied&&c.victory.searchState==='done');});
await test('Two heroes: search belongs to winner and handoff happens after its result',async()=>{await fresh({xp:0});w.Math.random=w.__testRandomOriginal;A.startWithHeroes(['warrior','mage']);w.Math.random=()=>.49;s=D.getState();s.order=['warrior','mage'];s.currentIndex=0;p=D.currentPlayer();D.combatStart(D.CARD_BY_ID[24]);c=s.combat;D.combatVictory();check(D.currentPlayer().id==='warrior');click();check(D.currentPlayer().id==='warrior');click();check(D.currentPlayer().id==='mage');check(D.victorySessionCombat().heroId==='warrior');check(c.victory.searchState==='done');});
await test('Rolling save resumes existing result without reroll or extra loot draw',async()=>{await fresh({xp:0});D.combatVictory();w.Math.random=()=>0;click();const saved=JSON.parse(JSON.stringify(A.exportState())),deck=JSON.stringify(saved.decks);await new Promise(r=>{game.onload=r;game.src='../index.html?resume-search'});w=game.contentWindow;d=w.document;D=w.__RPG_DEBUG__;A=w.__RPG_ONLINE__;d.getElementById('netLocal').click();A.applyState(saved);s=D.getState();p=D.currentPlayer();c=s.combat;D.renderCombat(true);d.getElementById('combatPostVictory').click();check(c.victory.searchRoll===1);check(JSON.stringify(s.decks)===deck);click();click();check(c.victory.searchDamageApplied&&c.victory.searchState==='done');});
await test('Post-victory healing does not precede the victory window',async()=>{await fresh({xp:0});p.currentHp=2;c.livingRune='healAfter';D.combatVictory();check(d.getElementById('rollPopupTitle').textContent==='Результаты боя');check(p.currentHp>2);click();check(d.getElementById('rollPopupTitle').textContent==='Живая руна героя · лечение');click();check(d.getElementById('rollPopupTitle').textContent==='Тщательный поиск · МУД');click();check(c.victory.searchState==='done');});
await test('Real dice animation finishes automatically and returns to victory result',async()=>{await fresh({xp:0});D.combatVictory();d.getElementById('rollPopupClose').click();check(c.victory.searchState==='rolling');await wait(5500);check(c.victory.searchState==='done','animation continuation stalled');check(d.getElementById('rollPopupTitle').textContent==='Результаты боя');check(text().includes('Можно открыть карт тайников'));});
for(let level=1;level<=5;level++)await test('Rogue '+level+' correct damage die ×2 and bleeding',async()=>{await fresh({hero:'rogue',xp:10000});c.enemyHp=100;c.enemyMaxHp=100;c.phase='hero_turn';const b=P.hero('rogue').branches.find(b=>b.kind==='ability'),n=b.nodes.find(n=>n.level===level);let q=n;while(q){p.learnedAbilities.push(q.id);q=b.nodes.find(x=>x.id===q.parent)}w.Math.random=()=>.99;const r=P.rules(n);check(r.dice===(level===1?'D4':'D6')&&r.multiplier===2);if(level===3)check(r.chance.sides===6&&r.chance.success.join()==='5,6');if(level===4)check(r.chance.sides===4&&r.chance.success.join()==='3,4');if(level===5)check(r.chance.sides===0);D.useHeroCombatAbility();check(c.enemyHp===100,'damage before animation');D.resolveHeroAbilityDamage();if(c.phase==='effect_check')D.resolveHeroEffectCheck();check(c.enemyHp===100-(level===1?8:12),'damage');if(level>=3)check(c.enemyBleed===2,'bleed');const hp=c.enemyHp;D.useHeroCombatAbility();check(c.enemyHp===hp,'repeated ability');});
progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL '+results.filter(x=>!x.pass).length+'/'+results.length;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
