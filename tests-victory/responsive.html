<!doctype html><meta charset="utf-8"><title>Victory responsive</title><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{const results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));for(const [width,height] of [[320,568],[360,640],[390,844],[430,932],[768,1024],[844,390],[1366,768],[1920,1080]]){game.style.width=width+'px';game.style.height=height+'px';await new Promise(r=>{game.onload=r;game.src='preview.html?size='+width});await wait(1550);const d=game.contentWindow.document.getElementById('game').contentDocument,card=d.querySelector('.roll-popup-card'),notice=d.getElementById('victoryLevelUp'),btn=d.getElementById('rollPopupClose');const inside=el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.left>=-1&&r.right<=width+1&&r.top>=-1&&r.bottom<=height+1};results.push({name:width+'×'+height,pass:inside(card)&&inside(notice)&&inside(btn),card:card.getBoundingClientRect().toJSON(),notice:notice?.getBoundingClientRect().toJSON()});report.textContent=JSON.stringify(results,null,2)}progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL';})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
