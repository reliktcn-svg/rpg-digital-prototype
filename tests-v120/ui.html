<!doctype html><meta charset="utf-8"><h1 id="result">Running</h1><pre id="report"></pre><iframe id="game" width="1200" height="850"></iframe><script>
(async()=>{
const params=new URLSearchParams(location.search);game.width=params.get('w')||1200;game.height=params.get('h')||850;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),checks=[],check=(x,m)=>{if(!x)throw Error(m||'Assertion')};
await new Promise(r=>{game.onload=r;game.src='../index.html?test120=1'});
const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__,A=w.__RPG_ONLINE__;
async function test(name,fn){try{await fn();checks.push([name,'PASS'])}catch(e){checks.push([name,e.stack])}report.textContent=JSON.stringify(checks,null,2)}
function fresh(ids=['warrior','dwarf']){D.setState(D.freshState());D.startGame(ids);return D.getState()}
d.querySelector('#netLocal').click();
await test('Settings closes when opening dice settings',async()=>{fresh();d.querySelector('[data-table-settings]').click();check(!d.querySelector('#settingsOverlay').hidden);d.querySelector('#settingsDiceBtn').click();check(d.querySelector('#settingsOverlay').hidden);check(d.querySelector('.dice-settings'));d.querySelector('.dice-settings [data-close]')?.click()});
await test('Choose a triple: highlight then explicit confirmation',async()=>{
 const s=fresh(),p=D.currentPlayer();p.gold=1000;s.locations={};
 const h=Object.keys(w.MAP_DATA.hexes).find(k=>w.MAP_DATA.hexes[k].region==='kingdom'&&w.MAP_DATA.hexes[k].neighbors.filter(n=>w.MAP_DATA.hexes[n].region==='kingdom').length>=3);
 const four=[h,...w.MAP_DATA.hexes[h].neighbors.filter(n=>w.MAP_DATA.hexes[n].region==='kingdom').slice(0,3)];p.hex=h;
 four.forEach(x=>s.territories[x]={owner:p.id,areaId:null});D.updateUI();D.renderBoard();
 const buttons=()=>[...d.querySelectorAll('#actionPanel button')];
 check(buttons().filter(b=>b.textContent.startsWith('Объединение №')).length>=2,'missing variants');
 buttons().find(b=>b.textContent.startsWith('Объединение №2')).click();
 check(s.areas.length===0,'premature merge');check(d.querySelectorAll('.area-merge-preview').length===3,'missing highlights');
 check(buttons().some(b=>b.textContent==='Подтвердить'));
 buttons().find(b=>b.textContent==='Подтвердить').click();
 check(!d.querySelectorAll('.area-merge-preview').length,'stale highlight');
 [...d.querySelectorAll('#modalContent button')].find(b=>b.textContent==='+1 СИЛ').click();
 check(s.areas.length===1,'area not created');
});
await test('Off-turn purchase remains available while another hero fights',async()=>{
 const s=fresh(),p=s.players.find(p=>p.id!==D.currentPlayer().id);p.gold=100;s.locations={};
 p.hex=Object.keys(w.MAP_DATA.hexes).find(h=>{s.cleaned[h]=true;return D.canBuildAt(p,h).ok});
 D.combatStart(D.CARD_BY_ID[1]);D.cancelCombatAuto();const c=s.combat,i=s.currentIndex;
 A.setLocalHeroId(p.id);D.openCharacterSheet('inventory',null,p.id);
 const buy=d.querySelector('#sheetContent [data-buy-territory]');check(buy,'missing inventory purchase');buy.click();
 check(s.territories[p.hex]?.owner===p.id);check(s.combat===c&&s.currentIndex===i,'changed active fight');
 const payload=A.exportSideState(p.id);check(payload.territories[p.hex]?.owner===p.id,'missing network payload');
 A.setLocalHeroId(null);D.closeCharacterSheet();
});
result.textContent=checks.every(c=>c[1]==='PASS')?'PASS '+checks.length:'FAIL';
})();
</script>
