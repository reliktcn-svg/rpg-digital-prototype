<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мастерская кубиков</title><link rel="stylesheet" href="arcana/dice-settings.css"><style>body{margin:0;background:#111a17;color:#eee4ce;font:15px/1.5 system-ui}main{max-width:850px;margin:auto;padding:20px}h1{font:30px Georgia}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,select{background:#304438;color:#fff;border:1px solid #8e987d;border-radius:7px;padding:10px 12px;min-height:44px}p{color:#bfc9bf}#packStatus{min-height:24px}</style><main><h1>Мастерская кубиков</h1><p>Только оформление. Анимация из 0.6.92. Исходный рисунок — технический образец, его заменяем своими слоями.</p><nav><select id="die" aria-label="Форма кубика"><option>20</option><option>12</option><option>10</option><option>8</option><option>6</option><option>4</option></select><button id="roll">Бросить</button><button id="all">Все формы</button><button id="journalDiceBtn">Цвета и текстура</button><button id="reloadPack">Обновить коллекцию</button></nav><p id="packStatus" role="status"></p><div id="dice"></div><p>Путь набора: <code>assets/dice/packs/</code>. Цвета рамки, фона и цифр меняются отдельно. Грани без собственного рисунка используют обычное оформление.</p></main><script src="arcana/dice-motion.js"></script><script src="arcana/dice-skins.js"></script><script src="arcana/dice-renderer.js"></script><script src="arcana/dice-animator.js"></script><script src="arcana/dice-packs.js"></script><script src="arcana/dice-settings.js"></script><script>
RPGDiceSettings.setContext(()=>({id:'warrior',name:'Пробный герой — Воин'}));
const api=FantasyDice.create({container:document.getElementById('dice'),duration:2400,controls:true}),status=document.getElementById('packStatus');
function configure(){const s=RPGDiceSettings.get();api.setSkin(RPGDiceSettings.resolveSkin(s));api.setSpeed(s.speed);api.setMotion(s.motion);}
function roll(all=false){configure();const sides=all?[4,6,8,10,12,20]:[Number(document.getElementById('die').value)];api.play({label:'Проверка оформления',dice:sides.map(n=>({sides:n,value:n}))});}
async function reload(){await FantasyDicePacks.refresh();status.textContent=FantasyDicePacks.error?'Набор не обновлён: '+FantasyDicePacks.error:FantasyDicePacks.list().map(p=>p.name).join(' · ')||'Нет внешних оформлений';roll();}
document.getElementById('roll').onclick=()=>roll();document.getElementById('all').onclick=()=>roll(true);document.getElementById('die').onchange=()=>roll();document.getElementById('reloadPack').onclick=reload;document.querySelector('.dice-settings').addEventListener('close',()=>roll());
// The lab defaults to the pack; the game itself never forces this preference.
if(!RPGDiceSettings.get().pack)RPGDiceSettings.set({pack:'studio-sample'});reload();
</script></html>
