<!doctype html><meta charset="utf-8"><title>Map roster test</title><style>body{margin:0;background:#121511;color:white;font:14px system-ui}iframe{border:0;display:block}pre{white-space:pre-wrap}</style><p id="progress">Running</p><pre id="report"></pre><iframe id="map"></iframe><script>
(async()=>{const rows=[],check=(v,m='Assertion')=>{if(!v)throw Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));async function test(name,fn){try{await fn();rows.push({name,pass:true})}catch(e){rows.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(rows,null,2)}async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));return d}
const h=await api('/api/rooms',{name:'Map regression'}),url='/api/rooms/'+h.room.code,auth={playerId:h.playerId,playerSecret:h.playerSecret};await api(url+'/select',{...auth,heroId:'warrior'});
const ids=['warrior','dwarf','mage','archer','rogue','paladin'],names=['Воин','Дворф','Маг','Лучник','Разбойник','Паладин'];for(const id of ids.slice(1)){const p=await api(url+'/join',{name:id});await api(url+'/select',{playerId:p.playerId,playerSecret:p.playerSecret,heroId:id})}await api(url+'/start',auth);
const s={started:true,players:ids.map((id,i)=>({id,name:names[i],masteryPoints:i===0?270:10*i,currentHp:7+i,maxHp:14,gold:i*10,hex:'A1'})),order:ids,currentIndex:0,round:1,territories:Object.fromEntries(Array.from({length:5},(_,i)=>['test'+i,{owner:'warrior'}])),areas:[{id:1,owner:'warrior',hexes:[]}],locations:{}};await api(url+'/game/init',{...auth,state:s});
const q=new URLSearchParams(location.search);map.style.width=(Number(q.get('width'))||1280)+'px';map.style.height=(Number(q.get('height'))||720)+'px';await new Promise(r=>{map.onload=r;map.src='../map.html?code='+h.room.code});const d=map.contentDocument;for(let i=0;i<60&&!d.querySelector('.map-player');i++)await wait(100);
await test('Map displays six players, level, HP, gold and 5/1 lands',()=>{check(d.querySelectorAll('.map-player').length===6);const text=d.querySelector('.map-player').textContent;check(text.includes('10 УР')&&text.includes('7/14')&&text.includes('Золото 0')&&text.includes('5/1'),text)});
for(const [width,height] of [[320,568],[390,844],[844,390],[1280,720],[1920,1080]])await test('Map layout '+width+'×'+height,async()=>{map.style.width=width+'px';map.style.height=height+'px';await wait(60);const roster=d.getElementById('mapPlayers').getBoundingClientRect(),field=d.getElementById('field').getBoundingClientRect();check(field.top>=roster.bottom-.5,'map under roster');check(field.right<=width+.5&&field.bottom<=height+.5,'map outside viewport');check(d.documentElement.scrollWidth<=width);check(d.querySelectorAll('.map-player strong').length===6);for(const p of d.querySelectorAll('.map-player')){const a=p.querySelector('img').getBoundingClientRect(),b=p.querySelector('div').getBoundingClientRect();check(a.right<b.left)}});
await test('Live map updates HP, gold, level, lands and active hero',async()=>{s.players[0].currentHp=3;s.players[0].gold=25;s.players[0].masteryPoints=325;s.territories.test5={owner:'warrior'};s.currentIndex=1;await api(url+'/game/state',{...auth,baseRevision:1,state:s});for(let i=0;i<60&&!d.querySelector('.map-player').textContent.includes('11 УР');i++)await wait(100);const text=d.querySelector('.map-player').textContent;check(text.includes('11 УР')&&text.includes('3/14')&&text.includes('Золото 25')&&text.includes('6/1'));check(d.querySelector('.map-player.active').textContent.startsWith('Дворф'))});
map.style.width=(Number(q.get('width'))||1280)+'px';map.style.height=(Number(q.get('height'))||720)+'px';progress.textContent=rows.every(r=>r.pass)?'PASS '+rows.length:'FAIL';if(q.has('preview')){progress.hidden=true;report.hidden=true}
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
