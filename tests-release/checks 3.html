<!doctype html><meta charset="utf-8"><title>v0.6.98 regression</title><style>body{background:#181c18;color:#eee;font:14px system-ui}pre{white-space:pre-wrap}iframe{border:0;width:390px;height:844px}</style><h1>v0.6.98</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{const rows=[],check=(v,m='Assertion failed')=>{if(!v)throw Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));async function test(name,fn){try{await fn();rows.push({name,pass:true})}catch(e){rows.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(rows,null,2)}await new Promise(r=>{game.onload=r;game.src='../index.html?release-test'});const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__,A=w.__RPG_ONLINE__;d.getElementById('netLocal').click();
for(const [width,height] of [[320,568],[390,844],[568,320],[768,1024],[844,390],[1280,720],[1920,1080]])await test('Hero picker non-overlap '+width+'×'+height,async()=>{game.style.width=width+'px';game.style.height=height+'px';await wait(60);for(const card of d.querySelectorAll('.hero-option')){const a=card.querySelector('img').getBoundingClientRect(),b=card.querySelector('.hero-choice-main').getBoundingClientRect(),c=card.getBoundingClientRect();check(a.right<b.left,'text overlaps portrait');check(b.right<=c.right&&b.left>=c.left,'text outside card');check(b.bottom<=c.bottom,'text below card')}check(d.documentElement.scrollWidth<=width,'page horizontal overflow')});
await test('Radio selection starts exactly one hero with full game systems',()=>{d.querySelector('input[value="paladin"]').click();check(d.querySelectorAll('#heroPicker input:checked').length===1);d.getElementById('startBtn').click();const s=D.getState();check(s.started&&s.mode==='solo'&&s.players.length===1&&s.order[0]==='paladin');check(s.players[0].currentHp===10&&s.locations&&s.decks);D.openCharacterSheet('overview');check(d.getElementById('heroSkillTree'));D.closeCharacterSheet();const before=s.players[0].personalTurn;D.advanceTurnState(s.players[0]);check(s.round===2&&s.currentIndex===0&&s.players[0].personalTurn===before+1);d.getElementById('moveRollBtn').click();check(s.rolled&&s.die>=1&&s.die<=6)});
await test('Different new parties use different random orders, no duplicates',()=>{const samples=[];for(let i=0;i<20;i++){const decks=D.initialDecks();for(const key of ['exploreOuter','exploreHeart','lootOuter','lootHeart']){const ids=decks[key].draw;check(new Set(ids).size===ids.length)}samples.push(decks.exploreOuter.draw.join(','))}check(new Set(samples).size===20)});
await test('Deck drains without repetition then reshuffles discarded cards only',()=>{const s=D.getState();s.decks=D.initialDecks();const ids=[...s.decks.exploreOuter.draw],seen=[];for(let i=0;i<ids.length;i++){const card=D.drawCard('exploreOuter');seen.push(card.id);D.discardCard('exploreOuter',card)}check(new Set(seen).size===ids.length);const card=D.drawCard('exploreOuter');check(ids.includes(card.id));check(s.decks.exploreOuter.discard.length===0);check(s.decks.exploreOuter.draw.length===ids.length-1);check([...s.decks.exploreOuter.draw,card.id].sort((a,b)=>a-b).join()===ids.sort((a,b)=>a-b).join());check(s.decks.exploreOuter.draw.join()!==seen.slice(0,-1).join(),'reshuffle retained sequence')});
await test('No mercenaries across 3 full loot deck cycles; tavern still hires',()=>{const s=D.getState();s.decks=D.initialDecks();for(const key of ['lootOuter','lootHeart']){const count=s.decks[key].draw.length;for(let i=0;i<count*3;i++){const card=D.drawCard(key);check(card&&card.fields['Тип'].toLowerCase()!=='наёмник');D.discardCard(key,card)}}const hex=Object.keys(s.locations).find(hex=>s.locations[hex].name==='Таверна');check(hex);const merc=D.ensureTavernMercenary(hex);check(merc&&merc.card.fields['Тип'].toLowerCase()==='наёмник');check(!Object.values(s.decks).some(deck=>[...deck.draw,...deck.discard].includes(merc.card.id)));D.discardCard('lootOuter',merc.card);check(s.decks[merc.key].discard.includes(merc.card.id));check(!s.decks.lootOuter.discard.includes(merc.card.id))});
await test('Old save migrates both draw and discard; held mercenaries not cloned',()=>{const decks=D.initialDecks();const outer=decks.mercOuter.draw.splice(0,2),heart=decks.mercHeart.draw.splice(0,2),held=decks.mercOuter.draw.pop();decks.lootOuter.draw.push(outer[0],heart[0]);decks.lootHeart.discard.push(outer[1],heart[1]);D.separateMercenaryDecks(decks);check(outer.every(id=>[...decks.mercOuter.draw,...decks.mercOuter.discard].includes(id)));check(heart.every(id=>[...decks.mercHeart.draw,...decks.mercHeart.discard].includes(id)));check(!Object.values(decks).some(d=>[...d.draw,...d.discard].includes(held)));const before=JSON.stringify(decks);D.separateMercenaryDecks(decks);check(JSON.stringify(decks)===before)});
await test('Network still starts six heroes',()=>{A.startWithHeroes(['warrior','dwarf','mage','archer','rogue','paladin']);check(D.getState().players.length===6)});
progress.textContent=rows.every(r=>r.pass)?'PASS '+rows.length:'FAIL '+rows.filter(r=>!r.pass).length;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
