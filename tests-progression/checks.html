<!doctype html><html lang="ru"><meta charset="utf-8"><title>Progression regression</title><style>body{background:#14211f;color:#eee;font:14px system-ui}pre{white-space:pre-wrap}iframe{width:390px;height:844px}</style><h1>Progression regression</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{const results=[],check=(v,m='Assertion')=>{if(!v)throw Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
await new Promise(r=>{game.onload=r;game.src='../index.html?progression-tests'});const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__,A=w.__RPG_ONLINE__,P=w.RPGProgression;d.getElementById('netLocal').click();const nativeRandom=w.Math.random;
function fresh(id='warrior'){w.RPGSkillTree.close();A.setLocalHeroId(null);w.Math.random=nativeRandom;A.startWithHeroes([id,id==='mage'?'warrior':'mage']);w.Math.random=()=>.49;const s=D.getState();s.order=[id,id==='mage'?'warrior':'mage'];s.currentIndex=0;const p=D.currentPlayer();p.masteryPoints=10000;D.ensurePlayerModel(p);D.combatStart(D.CARD_BY_ID[24]);D.combatFight();s.combat.enemyHp=500;s.combat.enemyMaxHp=500;s.combat.phase='hero_turn';return {s,p,c:s.combat}}
function setLevel(p,kind,level,status=-1){const b=P.hero(p.id).branches.find(b=>b.kind===kind&&(status<0||b.status===status));const n=b.nodes.find(n=>n.level===level);let q=n;while(q){if(!P.unlocked(p).has(q.id))p.learnedAbilities.push(q.id);q=b.nodes.find(x=>x.id===q.parent)}return n}
w.Math.random=()=>.49;
await test('Hero menu shows initial level and cumulative 0/10, then 2/10',()=>{const {p,s}=fresh();p.masteryPoints=0;s.combat=null;D.openCharacterSheet('overview',null,p.id);check(d.querySelector('.hero-progression-summary').textContent.includes('0/10'));D.recordEnemyVictory(p,{fields:{'Ранг':'Слабый'}},{});D.updateUI();check(d.querySelector('.hero-progression-summary').textContent.includes('2/10'));check(d.querySelector('.table-turn small').textContent==='1 УРОВЕНЬ')});
for(const id of ['warrior','dwarf','archer','rogue','mage'])for(let level=1;level<=5;level++)await test(`${id} ability ${level} applies atlas dice and only once`,()=>{const {p,c}=fresh(id);const n=setLevel(p,'ability',level),r=P.rules(n);p.currentHp=1;if(id==='warrior'||id==='dwarf'){c.phase='enemy_damage';c.pendingEnemyDamage={amount:30}}const beforeHp=p.currentHp,beforeEnemy=c.enemyHp;D.useHeroCombatAbility();check(c.heroAbilityUsed,'not used');check(c.lastRoll.title.includes(r.dice||r.fixedReduction),'wrong dice');if(id==='warrior'||id==='dwarf'){check(c.pendingEnemyDamage.amount<30,'no reduction');if(r.attackBonus)check(c.buffs.some(b=>b.type==='attack'&&b.amount===r.attackBonus));if(r.defenseBonus)check(D.combatEffectiveDefense(p)>=p.defense+r.defenseBonus)}else if(id==='mage')check(p.currentHp>beforeHp,'no healing');else check(c.enemyHp<beforeEnemy,'no damage');const after=JSON.stringify([p.currentHp,c.enemyHp,c.pendingEnemyDamage]);D.useHeroCombatAbility();check(JSON.stringify([p.currentHp,c.enemyHp,c.pendingEnemyDamage])===after,'ability repeated')});
await test('Ability cannot bypass silence lock',()=>{const {c}=fresh('archer');c.heroAbilityLocked=true;D.useHeroCombatAbility();check(!c.heroAbilityUsed&&c.enemyHp===500)});
await test('Mage IV can cleanse at full HP; selected status removed',()=>{const {p,c}=fresh('mage');setLevel(p,'ability',4);p.currentHp=p.maxHp;p.statuses=['Яд','Усталость'];check(D.combatClassAbilityAvailable(p));D.useHeroCombatAbility();check(c.phase==='cleanse_choice');D.chooseCombatCleanseStatus('Яд');check(!p.statuses.includes('Яд')&&p.statuses.includes('Усталость')&&c.phase==='hero_turn')});
for(const [i,status] of P.statusNames.entries())await test('Resistance '+status+' success prevents status and timers; failure applies',()=>{const {p,c}=fresh();setLevel(p,'resistance',1,i);w.Math.random=()=>.99;check(D.combatApplyHeroStatus(p,status,3)===false);check(!p.statuses.includes(status));check(!p.statusTimers[status]);if(status==='Оглушение')check(!c.heroStunned);w.Math.random=()=>0;check(D.combatApplyHeroStatus(p,status,3)===true);check(p.statuses.includes(status));w.Math.random=()=>.49});
await test('Natural20 I gives one enemy disadvantage, not the previous hero effect',()=>{const {p,c}=fresh('warrior');c.phase='hero_damage_ready';c.attackRoll={chosen:20,natural:20,profile:{damage:'D6',weapon:null}};D.combatRollHeroDamage();check(c.enemyDisadvantage===1&&c.heroAdvantage===0);check(c.pendingHeroDamage.amount===3)});
await test('Natural20 path extra damage and successful D6 stun apply together',()=>{const {p,c}=fresh('archer');const b=P.hero(p.id).branches.find(b=>b.kind==='natural'),n=b.nodes.find(n=>n.level===3&&n.description.includes('d6 урона'));let q=n;while(q){if(!P.unlocked(p).has(q.id))p.learnedAbilities.push(q.id);q=b.nodes.find(x=>x.id===q.parent)}w.Math.random=()=>.99;c.phase='hero_damage_ready';c.attackRoll={chosen:20,natural:20,profile:{damage:'D6',weapon:null}};D.combatRollHeroDamage();check(c.enemyDisadvantage===1&&c.enemyStunned===1);check(c.pendingHeroDamage.amount===12);check(c.lastRoll.dice.some(x=>x.sides===6));w.Math.random=()=>.49});
await test('Enemy poison ticks and appears on combat card',()=>{const {c}=fresh();D.combatApplyEnemyStatus('Яд',3);D.combatTickEnemyStatuses();check(c.enemyHp===498&&c.enemyPoison===2);D.renderCombat();check(d.getElementById('modal').textContent.includes('Яд'))});
await test('Victory XP is granted once and multiple thresholds grant matching points',()=>{const {p,c}=fresh();p.masteryPoints=9;D.recordEnemyVictory(p,{fields:{'Ранг':'Мини-босс'}},c);check(p.masteryPoints===21&&P.info(p).level===2&&P.info(p).points===1);D.recordEnemyVictory(p,{fields:{'Ранг':'Мини-босс'}},c);check(p.masteryPoints===21);p.masteryPoints=9;P.award(p,{fields:{'Ранг':'Мини-босс'}},{});P.award(p,{fields:{'Ранг':'Элитный'}},{});check(P.info(p).level===3&&P.info(p).points===2)});
await test('Save/export + reload preserves XP and independent resistance paths',()=>{const {p}=fresh();setLevel(p,'resistance',2,1);setLevel(p,'resistance',1,0);const stored=JSON.stringify(A.exportState());A.applyState(JSON.parse(stored));const actual=D.getPlayer(p.id);check(actual.masteryPoints===10000);check(P.selected(actual,'resistance',1).level===2&&P.selected(actual,'resistance',0).level===1)});
await test('Opening tree with no points is allowed; all icons have Roman levels',async()=>{const {p,s}=fresh();s.combat=null;p.masteryPoints=0;D.openHeroProgression(p.id);await wait(100);check(d.querySelector('.skill-tree-dialog').open);check(d.querySelectorAll('.skill-node').length===32);check([...d.querySelectorAll('.skill-node b')].every(x=>/^[IVX]+$/.test(x.textContent)));d.querySelector('[data-skill="n1_C10"]').click();check(d.querySelector('.skill-detail-dialog').open);check(d.querySelector('[data-learn]').disabled);d.querySelector('.skill-detail-dialog [data-close]').click();d.querySelector('.skill-tree-dialog .skill-footer [data-close]').click();check(!d.querySelector('.skill-tree-dialog').open)});
await test('Tree purchase UI spends a point and sibling Natural20 path stays locked',async()=>{const {p,s}=fresh();s.combat=null;p.masteryPoints=10;D.openHeroProgression(p.id);await wait(100);d.querySelector('[data-skill="n1_L10"]').click();d.querySelector('[data-learn]').click();await wait(100);check(P.info(p).points===0,'points='+P.info(p).points+' detail='+d.querySelector('.skill-detail-dialog').textContent);check(P.unlocked(p).has('n1_L10'));check(!P.canLearn(p,'n1_N10').ok);check(d.querySelector('.skill-detail-dialog').textContent.includes('Изучено'))});

for(let level=1;level<=5;level++)await test('Paladin counter '+level+' uses its die, heals actual damage and preserves normal attack',()=>{const {p,c}=fresh('paladin');const n=setLevel(p,'ability',level);p.currentHp=6;c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=4;const before=c.enemyHp;D.useHeroCombatAbility();check(c.phase==='paladin_counter'&&c.heroAbilityUsed);check(c.lastRoll.dice[0].sides===[4,6,8,10,12][level-1]);check(c.enemyHp===before,'damage must wait for animation');D.resolvePaladinCounter();const actual=before-c.enemyHp;check(actual>0&&p.currentHp===Math.min(10,6+Math.floor(actual/2)));check(c.phase==='hero_turn');check(D.combatAttackStatProfile(p).damage==='D6'&&D.combatAttackStatProfile(p).key==='wis');check(!D.combatClassAbilityAvailable(p));});
await test('Paladin cannot counter before damage, after zero damage or when dead',()=>{const {p,c}=fresh('paladin');check(!D.combatClassAbilityAvailable(p));c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=0;check(!D.combatClassAbilityAvailable(p));c.lastAcceptedDamage=2;p.currentHp=0;check(!D.combatClassAbilityAvailable(p))});
await test('Declining counter preserves the ability for a later hit',()=>{const {p,c}=fresh('paladin');c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2;D.combatContinueAfterDamage();check(!c.heroAbilityUsed&&!c.paladinCounterOpportunity&&c.phase==='hero_turn');c.phase='enemy_damage';c.pendingEnemyDamage={amount:2};D.acceptEnemyDamage();check(c.phase==='post_damage'&&D.combatClassAbilityAvailable(p))});
await test('Counter applies armor and caps healing at actual remaining enemy HP',()=>{const {p,c}=fresh('paladin');p.currentHp=3;c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2;c.cardId=47;c.enemyHp=1;c.enemyMaxHp=1;D.useHeroCombatAbility();D.resolvePaladinCounter();check(p.currentHp===4,'one actual damage heals minimum one HP');check(c.masteryAwarded&&c.phase==='victory')});
await test('Lethal enemy damage does not offer counter or consume it',()=>{const {p,c}=fresh('paladin');p.currentHp=1;c.phase='enemy_damage';c.pendingEnemyDamage={amount:20};D.acceptEnemyDamage();check(D.getState().combat===null);check(!c.heroAbilityUsed)});
await test('Six heroes start and Paladin uses atlas Natural20 I',()=>{w.Math.random=nativeRandom;A.startWithHeroes(['warrior','dwarf','mage','archer','rogue','paladin']);w.Math.random=()=>.49;check(D.getState().players.length===6);const {p,c}=fresh('paladin');check(D.canEquipCard(p,D.CARD_BY_ID[155]).ok);c.phase='hero_damage_ready';c.attackRoll={chosen:20,natural:20,profile:{damage:'D6',weapon:null}};D.combatRollHeroDamage();check(c.enemyDisadvantage===1);check(D.heroCombatInfo(p).ability.includes('контрудар'))});
await test('All rank dice colors and speed x2; personal choice stays individual',()=>{for(const [rank,color] of [['Слабый','#60646C'],['Обычный','#388E3C'],['Сильный','#2454C6'],['Эпичный','#8B45BD'],['Мини-босс','#D62828'],['Босс','#D62828']]){const value=D.enemyDicePreferences({fields:{'Ранг':rank}},{});check(value.colors.face===color&&value.speed===2)}const {c}=fresh();c.phase='enemy_ready';D.combatEnemyTurn();check(c.lastRoll.diceHeroId===null&&c.lastRoll.dicePreferences.speed===2&&c.lastRoll.dicePreferences.skin==='custom');check(w.RPGDiceSettings.get(null).speed===2);w.RPGDiceSettings.set({speed:4},'paladin');check(w.RPGDiceSettings.get('paladin').speed===4&&w.RPGDiceSettings.get(null).speed===2)});

for(const id of ['warrior','dwarf','mage','archer','rogue','paladin'])for(const [i,status] of P.statusNames.entries())await test(id+' immunity III '+status,()=>{const {p,c}=fresh(id);setLevel(p,'resistance',3,i);w.Math.random=()=>0;check(D.combatApplyHeroStatus(p,status,3)===false);check(!p.statuses.includes(status)&&!p.statusTimers[status]);if(status==='Оглушение')check(!c.heroStunned)});
await test('Warrior V fixed protection 12 without dice',()=>{const {p,c}=fresh();setLevel(p,'ability',5);c.phase='enemy_damage';c.pendingEnemyDamage={amount:30};D.useHeroCombatAbility();check(c.pendingEnemyDamage.amount===18);check(!c.lastRoll.dice?.length);check(c.buffs.some(b=>b.type==='attack'&&b.amount===2&&b.remaining===2))});
await test('Paladin confirmation green; decline red; no once-per-battle copy',()=>{const {p,c}=fresh('paladin');c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2;D.renderCombat();check(d.getElementById('combatHeroAbility').classList.contains('success'));check(d.getElementById('combatContinueAfterDamage').classList.contains('danger'));check(!/раз за бой/.test(D.heroCombatInfo(p).effect));});
await test('Paladin 5 actual damage heals 2, and once-per-battle survives atlas refresh',async()=>{const {p,c}=fresh('paladin');setLevel(p,'ability',2);p.currentHp=3;c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2;w.Math.random=()=>.7;D.useHeroCombatAbility();c.pendingPaladinCounter.amount=5;D.resolvePaladinCounter();check(p.currentHp===5);await w.RPGAtlas.refresh();check(c.heroAbilityUsed&&!D.combatClassAbilityAvailable(p));check(D.heroCombatInfo(p).effect.includes('половине')&&!D.heroCombatInfo(p).shortEffect)});

for(const [damage,healing] of [[0,0],[1,1],[2,1],[3,1],[4,2],[5,2],[6,3],[7,3],[8,4],[9,4],[10,5],[11,5],[12,6]])await test('Paladin damage '+damage+' heals '+healing,()=>{const {p,c}=fresh('paladin');p.currentHp=1;c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2;D.useHeroCombatAbility();c.pendingPaladinCounter.amount=damage;const before=c.enemyHp;D.resolvePaladinCounter();check(before-c.enemyHp===damage);check(p.currentHp===1+healing);check(c.heroAbilityUsed);});
await test('Paladin completely absorbed counter grants no healing',()=>{const {p,c}=fresh('paladin');p.currentHp=3;c.cardId=47;c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2;D.useHeroCombatAbility();c.pendingPaladinCounter.amount=1;const before=c.enemyHp;D.resolvePaladinCounter();check(c.enemyHp===before&&p.currentHp===3)});
await test('Paladin minimum healing respects maximum HP',()=>{const {p,c}=fresh('paladin');p.currentHp=p.maxHp;c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2;D.useHeroCombatAbility();c.pendingPaladinCounter.amount=1;D.resolvePaladinCounter();check(p.currentHp===p.maxHp)});
w.RPGSkillTree.close();D.getState().combat=null;progress.textContent=results.every(x=>x.pass)?`PASS ${results.length}`:`FAIL ${results.filter(x=>!x.pass).length}/${results.length}`;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});
</script></html>
