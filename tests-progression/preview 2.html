const q=new URLSearchParams(location.search),width=Number(q.get('width')||1280),height=Number(q.get('height')||800);game.style.width=width+'px';game.style.height=height+'px';game.src='../index.html?progression-preview';game.onload=()=>{const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__,A=w.__RPG_ONLINE__;d.getElementById('netLocal').click();A.startWithHeroes(['warrior','dwarf','mage','archer','rogue','paladin']);D.getState().players.forEach(p=>{p.masteryPoints=70});D.getState().order=['warrior','dwarf','mage','archer','rogue','paladin'];D.getState().currentIndex=0;D.updateUI();function open(){w.RPGSkillTree.close();D.openCharacterSheet('overview',null,hero.value);D.openHeroProgression(hero.value)}hero.onchange=open;reopen.onclick=open;measure.onclick=()=>{const box=d.querySelector('.skill-tree-dialog'),content=box.querySelector('.skill-content'),buttons=[...box.querySelectorAll('.skill-node')],b=box.getBoundingClientRect(),f=box.querySelector('.skill-footer').getBoundingClientRect();report.textContent=JSON.stringify({viewport:[width,height],dialog:[b.x,b.y,b.width,b.height],fitsViewport:b.x>=0&&b.y>=0&&b.right<=width&&b.bottom<=height,horizontalOverflow:content.scrollWidth>content.clientWidth,verticalScroll:content.scrollHeight>content.clientHeight,footerVisible:f.bottom<=height,minTarget:Math.min(...buttons.map(x=>x.getBoundingClientRect().width)),iconsLoaded:buttons.every(x=>x.querySelector('img').naturalWidth>0),nodes:buttons.length},null,2)};open()};
