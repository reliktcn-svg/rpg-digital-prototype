<!doctype html><meta charset="utf-8"><title>RPG runtime diagnostics</title><pre id="report">Running</pre><iframe id="game"></iframe><script>
(async()=>{const errors=[];window.recordError=e=>errors.push(e);const html=await(await fetch('../index.html')).text();const hook=`<base href="../"><script>window.addEventListener('error',e=>parent.recordError({message:e.message,file:e.filename,line:e.lineno,stack:e.error?.stack}));window.addEventListener('unhandledrejection',e=>parent.recordError({message:String(e.reason),stack:e.reason?.stack}));<\/script>`;await new Promise(r=>{game.onload=r;game.srcdoc=html.replace('<head>','<head>'+hook)});const w=game.contentWindow,d=w.document;d.getElementById('netLocal').click();d.getElementById('startBtn').click();d.getElementById('mobileInventoryBtn').click();d.getElementById('sheetClose').click();w.__RPG_DEBUG__.combatStart(w.__RPG_DEBUG__.CARD_BY_ID[24]);await new Promise(r=>setTimeout(r,500));document.getElementById('report').textContent=JSON.stringify({finished:true,started:w.__RPG_DEBUG__.getState().started,errors},null,2);})();
</script>
