(async()=>{const results=[],sleep=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,m)=>{if(!v)throw Error(m)},wait=async(fn)=>{for(let i=0;i<400;i++){try{if(await fn())return}catch{}await sleep(100)}throw Error('timeout')},record=x=>{results.push(x);report.textContent=JSON.stringify(results,null,2)};try{

 check(old.contentWindow.RPG_CLIENT_BUILD.id===original,'other tab changed');const text=await old.contentWindow.fetch('../update-probe.js').then(r=>r.text());check(text.includes('"A"'),'old tab mixed new resource');const newer=await w().fetch('../update-probe.js').then(r=>r.text());check(newer.includes('"B"'),'new tab did not use new resource');record('PASS two tabs pinned to independent verified resource versions');record('COMPLETE');
