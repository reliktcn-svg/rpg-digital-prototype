<!doctype html><meta charset="utf-8"><title>Mercenary flows and responsive checks</title><p id="progress">Running</p><pre id="report"></pre><iframe id="game" style="width:390px;height:780px;position:absolute;left:-10000px"></iframe><script>
(async()=>{let w,d,D,P,s,p;const out=[],check=(v,m='assertion')=>{if(!v)throw Error(m)};
async function fresh(id=198){await new Promise(r=>{game.onload=r;game.src='../index.html?flows='+Math.random()});w=game.contentWindow;d=w.document;await w.RPGAtlas.ready;D=w.__RPG_DEBUG__;P=w.RPGProgression;d.getElementById('netLocal').click();D.startGame(['warrior']);s=D.getState();p=D.currentPlayer();p.equipment.mercenary=id;p.gold=1000;p.currentHp=8;w.Math.random=()=>.5}
async function test(name,fn){try{await fn();out.push({name,pass:true})}catch(e){out.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(out,null,2)}
function action(text){const b=[...d.querySelectorAll('#modalContent button')].find(b=>b.textContent.includes(text));check(b,'Missing '+text);b.click()}
function waitFor(fn){return new Promise((resolve,reject)=>{let n=0;const t=setInterval(()=>{if(fn()){clearInterval(t);resolve()}else if(n++>240){clearInterval(t);reject(Error('wait timeout'))}},50)})}
async function closeRoll(){await waitFor(()=>!d.getElementById('rollOverlay').hidden&&!d.getElementById('rollPopupClose').disabled);d.getElementById('rollPopupClose').click()}
await test('Tracker one peek; Deep scout two sequential peeks; card accounting',async()=>{for(const id of [198,269]){await fresh(id);s.exploration={hero:p.id,hex:p.hex,deckKey:'exploreOuter'};s.decks.exploreOuter={draw:[1,2,3],discard:[]};D.maybeUseTrackerBeforeExplore(p,'exploreOuter');check(d.getElementById('modalContent').textContent.includes('осталось '+(id===269?2:1)));action('Замешать');if(id===269){check(d.getElementById('modalContent').textContent.includes('осталось 1'));action('Разыграть')}D.cancelCombatAuto();check(s.combat&&s.decks.exploreOuter.draw.length===2);check(new Set([...s.decks.exploreOuter.draw,s.combat.cardId]).size===3)}});
await test('Guide rerolls only failed trap; one use per personal turn',async()=>{await fresh(375);s.exploration={hero:p.id,hex:p.hex,deckKey:'exploreOuter'};w.Math.random=()=>.05;D.performTrapCheck(D.CARD_BY_ID[56]);await closeRoll();action('Перебросить');check(p.itemUsage[375].turn===p.personalTurn);await closeRoll();check(![...d.querySelectorAll('#modalContent button')].some(b=>b.textContent.includes('Перебросить · Проводник')))});
await test('Trap seeker can reroll success, separately from its combat reduction',async()=>{await fresh(378);s.exploration={hero:p.id,hex:p.hex,deckKey:'exploreOuter'};w.Math.random=()=>.85;D.performTrapCheck(D.CARD_BY_ID[56]);await closeRoll();action('Перебросить');check(p.itemUsage[378].turn===p.personalTurn);D.combatStart(D.CARD_BY_ID[1]);D.cancelCombatAuto();s.combat.phase='enemy_damage';s.combat.pendingEnemyDamage={amount:9};check(D.supportedCombatEffect(p,D.CARD_BY_ID[378],{where:'equipment',slot:'mercenary'}).enabled)});
await test('Tavern rejects under-level visitor without replacing stock or charging gold',async()=>{await fresh(325);const hex=Object.keys(w.MAP_DATA.hexes).find(h=>w.MAP_DATA.hexes[h].region==='cursed');s.locations[hex]={name:'Таверна',tavernMercenaryId:325};p.hex=hex;p.masteryPoints=P.threshold(9);D.renderTavernVisit(p,hex,()=>{},{healed:false});check(d.getElementById('tavernHire').disabled);const before=p.gold;d.getElementById('tavernHire').click();check(p.gold===before&&s.locations[hex].tavernMercenaryId===325);p.masteryPoints=P.threshold(10);D.renderTavernVisit(p,hex,()=>{},{healed:false});check(!d.getElementById('tavernHire').disabled)});
await test('Arcanist lethal damage still shows D6 before victory',async()=>{await fresh(383);D.combatStart(D.CARD_BY_ID[1]);D.cancelCombatAuto();const c=s.combat;c.phase='hero_damage';c.enemyHp=3;c.pendingHeroDamage={amount:1,profile:D.combatAttackStatProfile(p)};w.Math.random=()=>.999;D.applyCombatItemEffect(p,383,{where:'equipment',slot:'mercenary'});D.cancelCombatAuto();check(c.enemyHp===3&&c.phase==='hero_damage'&&c.lastRoll.dice[0].sides===6);D.applyHeroDamageNow();D.cancelCombatAuto();check(c.enemyHp===0&&c.victory)});
await test('Regeneration tree on desktop, small phone and landscape; 3 icons and accessible close',async()=>{await fresh();p.masteryPoints=P.threshold(7);for(const [width,height] of [[1440,1000],[1024,768],[390,844],[320,568],[844,390]]){game.style.width=width+'px';game.style.height=height+'px';D.openHeroProgression(p.id);await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));const box=d.querySelector('.skill-tree-dialog'),content=d.querySelector('.skill-content');check(box&&box.open,'tree closed');check(box.getBoundingClientRect().width<=width,'dialog overflow '+width);check(content.scrollWidth<=content.clientWidth+2,'content width '+width);check(box.querySelectorAll('.skill-regen .skill-node').length===3);check([...box.querySelectorAll('[data-close]')].every(x=>x.getBoundingClientRect().height>=40));w.RPGSkillTree.close();}});
await test('All 15 new square PNG portraits load',async()=>{await fresh();await Promise.all(Array.from({length:15},(_,i)=>new Promise((resolve,reject)=>{const image=new w.Image();image.onload=()=>{try{check(image.naturalWidth===image.naturalHeight&&image.naturalWidth>=1000,'square image '+i);resolve()}catch(e){reject(e)}};image.onerror=()=>reject(Error('image '+(372+i)));image.src='../assets/items/'+(372+i)+'.png'})))});
progress.textContent=out.every(x=>x.pass)?'PASS '+out.length:'FAIL '+out.filter(x=>!x.pass).length;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
