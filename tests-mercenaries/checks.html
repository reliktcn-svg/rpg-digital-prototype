<!doctype html><meta charset="utf-8"><title>Mercenary and regeneration checks</title><p id="progress">Running</p><pre id="report"></pre><iframe id="game" style="width:390px;height:700px" hidden></iframe><script>(async()=>{await new Promise(r=>{game.onload=r;game.src='../index.html?merc-test=1'});const w=game.contentWindow;await w.RPGAtlas.ready;
 const D=w.__RPG_DEBUG__,P=w.RPGProgression,tests=[];const check=(x,m='assertion')=>{if(!x)throw Error(m)};
 function test(name,fn){try{fn();tests.push({name,pass:true})}catch(e){tests.push({name,pass:false,error:e.stack})}}
 w.document.getElementById('netLocal').click();
 function fresh(hero='warrior',merc=null){D.setState(D.freshState());D.startGame([hero]);const s=D.getState(),p=D.currentPlayer();p.equipment.mercenary=merc;p.gold=1000;p.maxHp=40;p.currentHp=20;return {s,p}}
 function combat(merc,hero='warrior'){const {s,p}=fresh(hero,merc);D.combatStart(D.CARD_BY_ID[1]);D.cancelCombatAuto();const c=s.combat;c.phase='hero_turn';c.enemyHp=100;c.enemyMaxHp=100;return {s,p,c}}
 const use=(p,id)=>{D.applyCombatItemEffect(p,id,{where:'equipment',slot:'mercenary'});D.cancelCombatAuto()};
 test('33 mercenaries; prices approved; new cards never enter loot',()=>{const {s,p}=fresh();const cards=Object.values(D.CARD_BY_ID).filter(c=>c.mercenaryTier);check(cards.length===33);check(D.CARD_BY_ID[327].fields['Цена найма']==48);check(D.CARD_BY_ID[329].fields['Цена найма']==55);check(D.CARD_BY_ID[378].name==='Искатель ловушек');for(const k of ['lootOuter','lootHeart'])check(s.decks[k].draw.every(id=>D.CARD_BY_ID[id].fields['Тип']!=='наёмник'));check(s.decks.mercOuter.draw.length+s.decks.mercHeart.draw.length===33)});
 test('Regeneration has no free rank; gates 3/5/7, costs 1/2/3 for all heroes',()=>{for(const h of D.HEROES){const {p}=fresh(h.id);check(P.selected(p,'regeneration')===null);for(let r=1;r<=3;r++){p.masteryPoints=P.threshold(2*r);check(!P.canLearn(p,h.id+'-regeneration-'+r).ok);p.masteryPoints=P.threshold(2*r+1);check(P.learn(p,h.id+'-regeneration-'+r).ok);check(P.selected(p,'regeneration').level===r)}check(P.info(p).spent===6&&P.info(p).points===0)}});
 test('No recovery without skill; learned skill heals once per round and caps HP',()=>{const {s,p}=fresh();s.round=2;check(D.recoverHealthForRound(p)===0&&p.currentHp===20);p.masteryPoints=P.threshold(7);for(let i=1;i<=3;i++)P.learn(p,p.id+'-regeneration-'+i);s.round=3;check(D.recoverHealthForRound(p)===3&&p.currentHp===23);check(D.recoverHealthForRound(p)===0);s.round=4;p.currentHp=39;check(D.recoverHealthForRound(p)===1&&p.currentHp===40)});
 test('Every rank / region / level / area hiring boundary',()=>{const {s,p}=fresh();for(const card of Object.values(D.CARD_BY_ID).filter(c=>c.mercenaryTier))for(const region of ['kingdom','cursed','heart_of_darkness'])for(const level of [1,4,5,9,10,12])for(const areas of [0,3,4,5]){p.masteryPoints=P.threshold(level);s.areas=Array.from({length:areas},(_,i)=>({id:i,owner:p.id}));const tier=card.mercenaryTier;const expected=tier==='common'||tier==='improved'?region==='kingdom':tier==='rare'?region==='cursed'||region==='kingdom'&&level>=5:tier==='epic'?region==='cursed'&&level>=10:region==='cursed'&&level>=10&&areas>=4;check(D.mercenaryEligible(card,p,region)===expected,`${card.id}/${region}/${level}/${areas}`)}});
 test('All eligible cards draw once before discard recycle, including epic and legendary',()=>{const {s,p}=fresh();p.masteryPoints=P.threshold(10);s.areas=Array.from({length:4},()=>({owner:p.id}));const ids=[];for(let i=0;i<19;i++){const e=D.takeMercenaryFromDeck(null,{player:p,region:'cursed'});check(e);ids.push(e.card.id);D.discardCard(e.key,e.card)}check(new Set(ids).size===19,ids.join(','));check(ids.some(id=>D.CARD_BY_ID[id].mercenaryTier==='legendary'));});
 test('Old save migration adds 15 cards exactly once and preserves held mercenaries',()=>{const {s,p}=fresh();p.equipment.mercenary=269;for(const d of Object.values(s.decks)){d.draw=d.draw.filter(id=>id<372&&id!==269);d.discard=d.discard.filter(id=>id<372&&id!==269)}delete s.mercenaryRevision;D.normalizeTavernMercenaries();const counts=()=>Object.values(s.decks).flatMap(d=>[...d.draw,...d.discard]);check(!counts().includes(269));check(counts().filter(id=>id>=372).length===15);D.normalizeTavernMercenaries();check(counts().filter(id=>id>=372).length===15)});
 test('Porter capacity +2; dismissal safely moves excess into pending items',()=>{const {p}=fresh('warrior',372);check(D.backpackCapacity(p)===12);p.backpack=Array.from({length:12},(_,i)=>141+i);D.setSlotId(p,'mercenary',197);check(D.backpackCapacity(p)===10&&p.backpack.length===10&&p.pendingItems.length===2)});
 test('Novice first-hit protection only; mist -1 on all enemy attacks',()=>{let {p,c}=combat(374);check(D.passiveHeroDamageReduction(p,5).amount===3);check(D.passiveHeroDamageReduction(p,5).amount===5);({p,c}=combat(380));const b=D.combatEnemyAttackModifier(p);p.equipment.mercenary=null;check(D.combatEnemyAttackModifier(p)===b+1)});
 test('Sergeant +2 only next ordinary attack, not class ability; cannot reuse',()=>{const {p,c}=combat(377,'archer');w.Math.random=()=>.45;use(p,377);const profile=D.heroAbilityAttackProfile(p);check(profile.stat===3);D.combatHeroAttack();D.cancelCombatAuto();check(c.attackRoll.bonus===5);check(!D.supportedCombatEffect(p,D.CARD_BY_ID[377],{where:'equipment',slot:'mercenary'}).enabled);c.phase='hero_turn';D.combatHeroAttack();D.cancelCombatAuto();check(c.attackRoll.bonus===3)});
 test('Herbalist D6 heal and poison resistance on 5,6 remain independent',()=>{const {p,c}=combat(376);w.Math.random=()=>.7;use(p,376);check(p.currentHp===25);check(D.mercenaryResists(p,'Яд'));w.Math.random=()=>.5;check(!D.mercenaryResists(p,'Яд'));check(!D.mercenaryResists(p,'Горение'))});
 test('Trap seeker D4, bastion D12, oath guardian 2D8 mitigation',()=>{for(const [id,amount] of [[378,4],[381,12],[384,16]]){const {p,c}=combat(id);c.phase='enemy_damage';c.pendingEnemyDamage={amount:30};w.Math.random=()=>.999;use(p,id);check(c.pendingEnemyDamage.amount===30-amount);check(!D.supportedCombatEffect(p,D.CARD_BY_ID[id],{where:'equipment',slot:'mercenary'}).enabled);if(id===381)check(c.mercenaryDefense===1)}});
 test('Surgeon heals and cleanses bleeding; light healer and oath guardian allow chosen cleanse',()=>{let {p,c}=combat(379);p.statuses=['Кровотечение'];p.statusTimers={'Кровотечение':2};w.Math.random=()=>.999;use(p,379);check(p.currentHp===28&&!p.statuses.length);for(const id of [382,384]){({p,c}=combat(id));p.statuses=['Яд','Горение'];c.phase=id===384?'enemy_damage':'hero_turn';c.pendingEnemyDamage={amount:20};use(p,id);check(c.phase==='cleanse_choice'&&c.pendingCleanse.options.length===2);D.chooseCombatCleanseStatus('Яд');D.cancelCombatAuto();check(!p.statuses.includes('Яд')&&p.statuses.includes('Горение'));}});
 test('Life keeper 2D8 + defense until next enemy attack',()=>{const {p,c}=combat(385);w.Math.random=()=>.999;use(p,385);check(p.currentHp===36&&c.mercenaryDefense===1);const defense=D.combatEffectiveDefense(p);c.phase='enemy_ready';D.combatEnemyTurn();D.cancelCombatAuto();check(c.enemyAttackRoll.target===defense&&c.mercenaryDefense===0)});
 test('Orc arcanist uses the damage D6 for stun, no second effect roll',()=>{for(const face of [4,5,6]){const {p,c}=combat(383);c.phase='hero_damage';c.pendingHeroDamage={amount:2};w.Math.random=()=>(face-.5)/6;use(p,383);check(c.pendingHeroDamage.amount===2+face);check((c.queuedHeroEffects?.length||0)===(face>=5?1:0));check(c.enemyHp===100)}});
 test('Chronicler rerolls ordinary and ability attacks with advantage and enemy disadvantage',()=>{for(const phase of ['hero_roll','ability_attack']){const {p,c}=combat(386);c.phase=phase;const a={chosen:1,rolls:[1],bonus:3,total:4,target:13,natural:1};c[phase==='hero_roll'?'attackRoll':'abilityAttackRoll']=a;let q=[.1,.8];w.Math.random=()=>q.shift()??.5;use(p,386);check(a.chosen===17&&a.total===20&&a.mode==='advantage'&&a.natural===null);check(c.enemyDisadvantage===1);check(c.used['item:386']);}});
 test('Chronicler can reroll escape D20; advantage has no natural 1/20',()=>{const {p,c}=combat(386);c.phase='escape_result';c.pendingEscape={kind:'during',d:1,dex:1,total:2,outcome:'nat1'};let q=[.01,.99];w.Math.random=()=>q.shift()??.5;use(p,386);check(c.pendingEscape.d===20&&c.pendingEscape.outcome==='success');check(c.enemyDisadvantage===1)});
report.textContent=JSON.stringify(tests,null,2);progress.textContent=tests.every(t=>t.pass)?'PASS '+tests.length:'FAIL '+tests.filter(t=>!t.pass).length;})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
