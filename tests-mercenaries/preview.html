<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v0.6.104 · Регенерация и наёмники</title><style>body{margin:0;background:#191b1d;color:#eedbb9;font:16px system-ui}header{padding:12px;display:flex;gap:10px;flex-wrap:wrap}button,select{font:inherit;padding:10px;border:1px solid #9b814f;border-radius:7px;color:inherit;background:#302a21}iframe{border:0;width:100%;height:calc(100dvh - 70px);display:block;margin:auto}button{cursor:pointer}</style><header><button id="tree">Регенерация</button><button id="tavern">Таверна</button><button id="bag">Инвентарь</button><select id="merc"></select><button id="phone">Телефон / ПК</button></header><iframe id="game" src="../index.html?merc-preview=1"></iframe><script>
let w,D,s,p,mobile=false;game.onload=async()=>{w=game.contentWindow;await w.RPGAtlas.ready;D=w.__RPG_DEBUG__;w.document.getElementById('netLocal').click();D.startGame(['warrior']);s=D.getState();p=D.currentPlayer();p.masteryPoints=w.RPGProgression.threshold(10);p.gold=100;p.currentHp=7;s.areas=Array.from({length:4},(_,i)=>({id:i+1,owner:p.id,hexes:[]}));for(const c of w.CARDS_DATA.filter(c=>c.mercenaryTier)){let o=new Option(c.name+' · '+c.fields['Редкость'],c.id);merc.add(o)}merc.value='376';tree.onclick()};tree.onclick=()=>{w.RPGSkillTree.close();D.openHeroProgression(p.id)};tavern.onclick=()=>{w.RPGSkillTree.close();D.closeCharacterSheet();const card=D.CARD_BY_ID[Number(merc.value)],region=['common','improved'].includes(card.mercenaryTier)?'kingdom':'cursed';const hex=Object.keys(w.MAP_DATA.hexes).find(h=>w.MAP_DATA.hexes[h].region===region);p.hex=hex;s.locations[hex]={name:'Таверна',tavernMercenaryId:Number(merc.value)};D.renderTavernVisit(p,hex,()=>{w.document.getElementById('modal').hidden=true},{healed:false})};bag.onclick=()=>{w.RPGSkillTree.close();w.document.getElementById('modal').hidden=true;D.setSlotId(p,'mercenary',Number(merc.value));D.openCharacterSheet('inventory')};phone.onclick=()=>{mobile=!mobile;game.style.width=mobile?'390px':'100%';game.style.maxWidth='100%'};
</script></html>
