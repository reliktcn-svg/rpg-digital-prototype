<!doctype html><meta charset="utf-8"><title>Ability attack checks</title><style>body{background:#17201e;color:#eee;font:14px system-ui}iframe{width:844px;height:650px}pre{white-space:pre-wrap}</style><h1>Ability attack + Charisma</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{let w,d,D,A,P,s,p,c;const results=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,m='Assertion')=>{if(!v)throw Error(m)};
async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
async function fresh(id='archer'){await new Promise(r=>{game.onload=r;game.src='../index.html?ability-attack='+Math.random()});w=game.contentWindow;d=w.document;D=w.__RPG_DEBUG__;A=w.__RPG_ONLINE__;P=w.RPGProgression;await w.RPGAtlas.ready;d.getElementById('netLocal').click();A.startWithHeroes([id]);s=D.getState();p=D.currentPlayer();p.masteryPoints=10000;D.ensurePlayerModel(p);w.Math.random=()=>.99;w.RPGDiceSettings.set({speed:4},id);D.CARD_BY_ID[1].fields['ЗЩ']=13;D.combatStart(D.CARD_BY_ID[1]);c=s.combat;c.phase=id==='paladin'?'post_damage':'hero_turn';c.paladinCounterOpportunity=id==='paladin';c.lastAcceptedDamage=2;c.enemyHp=100;c.enemyMaxHp=100;p.currentHp=4;D.cancelCombatAuto()}
function learn(level){const b=P.hero(p.id).branches[0],n=b.nodes[level-1];p.learnedAbilities.push(...b.nodes.slice(0,level).map(n=>n.id));return P.rules(n)}
async function until(fn,ms=12000){const end=Date.now()+ms;while(!fn()){if(Date.now()>end)throw Error('Timeout '+c.phase);await wait(20)}}
function visibleRoll(){return !!d.querySelector('.arcana-battle-layer:not([hidden])')}
for(const hero of ['archer','rogue','paladin'])for(const hit of [true,false])await test(hero+' '+(hit?'hit':'miss')+' real D20 then ordinary attack remains',async()=>{await fresh(hero);const face=hit?(hero==='paladin'?11:10):2;w.Math.random=()=>(face-.5)/20;D.renderCombat();d.getElementById('combatHeroAbility').click();check(c.phase==='ability_attack'&&visibleRoll());check(c.abilityAttackRoll.chosen===face);check(c.abilityAttackRoll.profile.key===(hero==='paladin'?'wis':'dex'));check(c.abilityAttackRoll.total===face+(hero==='archer'?4:hero==='rogue'?5:2));check(c.enemyHp===100&&p.currentHp===4);check(c.heroAbilityUsed&&c.heroAttackCount===0);const attackSeq=c.lastRoll.seq;w.Math.random=()=>.99;
if(hit){await until(()=>['ability_damage','paladin_counter'].includes(c.phase));check(c.lastRoll.seq>attackSeq&&c.lastRoll.dice.length===1&&c.lastRoll.dice[0].sides!==20);check(c.enemyHp===100&&p.currentHp===4&&visibleRoll());await until(()=>c.phase==='hero_turn');check(c.enemyHp<100);if(hero==='paladin')check(p.currentHp>4)}else{await until(()=>c.phase==='hero_turn');check(c.lastRoll.seq===attackSeq,'miss rolled damage');check(c.enemyHp===100&&p.currentHp===4&&!c.enemyBleed&&!c.enemyPoison);check(!D.combatClassAbilityAvailable(p),'miss refunded ability')}
check(!visibleRoll());check(d.getElementById('combatAttack'));d.getElementById('combatAttack').click();check(c.phase==='hero_roll'&&c.heroAttackCount===1);D.cancelCombatAuto();});
await test('Exact example: axe uses STR for ordinary attack, ability uses D20 10 + DEX 3 + CHA 1 = 14 vs 13',async()=>{await fresh();const axe=Object.values(D.CARD_BY_ID).find(x=>x.category==='Оружие'&&/топор/i.test(x.name)&&x.fields?.['Атака']?.includes('СИЛ'))||D.CARD_BY_ID[142];p.equipment.weapon=axe.id;check(D.combatAttackStatProfile(p).key==='str','axe fixture');w.Math.random=()=>.475;D.useHeroCombatAbility();check(c.abilityAttackRoll.total===14&&c.abilityAttackRoll.target===13&&c.abilityAttackRoll.profile.key==='dex');check(D.combatAbilityAttackHits());D.cancelCombatAuto();});
for(const hero of ['archer','rogue','paladin'])for(let level=1;level<=5;level++)await test(hero+' rank '+level+' same attack formula, atlas damage preserved',async()=>{await fresh(hero);const r=learn(level);D.useHeroCombatAbility();check(c.phase==='ability_attack'&&c.lastRoll.dice.length===1&&c.lastRoll.dice[0].sides===20);check(c.enemyHp===100&&!c.pendingAbilityDamage&&!c.pendingPaladinCounter);D.cancelCombatAuto();D.resolveHeroAbilityAttack();D.cancelCombatAuto();const amount=Number(r.dice.slice(1))*(r.multiplier||1);check(c.lastRoll.dice.length===1&&c.lastRoll.dice[0].sides===Number(r.dice.slice(1)));check((c.pendingAbilityDamage||c.pendingPaladinCounter).amount===amount);const seq=c.lastRoll.seq;D.resolveHeroAbilityAttack();check(c.lastRoll.seq===seq,'duplicate damage roll');});
await test('Miss on rank III never rolls or applies bleeding; ordinary action is intact',async()=>{await fresh('rogue');learn(3);w.Math.random=()=>.05;D.useHeroCombatAbility();D.cancelCombatAuto();D.resolveHeroAbilityAttack();D.cancelCombatAuto();check(c.phase==='hero_turn'&&!c.pendingAbilityDamage&&!c.pendingEffectCheck&&!c.enemyBleed&&c.enemyHp===100&&c.heroAttackCount===0);});
await test('Equal defense is a hit; CHA and class stat are current values, weapon attack bonus excluded',async()=>{await fresh();p.dex=1;p.cha=2;p.str=100;w.Math.random=()=>.475;D.useHeroCombatAbility();check(c.abilityAttackRoll.total===13&&D.combatAbilityAttackHits());D.cancelCombatAuto();});
await test('Natural 1 misses, natural 20 hits; ability check does not trigger ordinary Natural20 branch',async()=>{await fresh('rogue');p.dex=100;w.Math.random=()=>0;D.useHeroCombatAbility();check(!D.combatAbilityAttackHits());D.cancelCombatAuto();D.resolveHeroAbilityAttack();check(c.enemyHp===100);await fresh('rogue');D.CARD_BY_ID[1].fields['ЗЩ']=99;D.useHeroCombatAbility();check(D.combatAbilityAttackHits());D.cancelCombatAuto();D.resolveHeroAbilityAttack();check(!c.enemyDisadvantage&&!c.queuedHeroEffects?.length);D.cancelCombatAuto();});
await test('Pending ability D20 survives save/load and is resolved exactly once',async()=>{await fresh();w.Math.random=()=>.475;D.useHeroCombatAbility();D.cancelCombatAuto();const snapshot=JSON.parse(JSON.stringify(A.exportState()));A.applyState(snapshot);s=D.getState();c=s.combat;check(c.phase==='ability_attack'&&c.abilityAttackRoll.total===14&&c.enemyHp===100);D.resolveHeroAbilityAttack();D.cancelCombatAuto();check(c.phase==='ability_damage');const seq=c.lastRoll.seq;D.resolveHeroAbilityAttack();check(c.lastRoll.seq===seq);});
await test('Advantage uses class + charisma and is consumed once; normal attack count stays zero',async()=>{await fresh();c.heroAdvantage=1;let v=[.05,.95];w.Math.random=()=>v.length?v.shift():.99;D.useHeroCombatAbility();check(c.lastRoll.dice.length===2&&c.abilityAttackRoll.mode==='advantage'&&c.abilityAttackRoll.chosen===20&&c.abilityAttackRoll.natural===null);check(c.heroAdvantage===0&&c.heroAttackCount===0);D.cancelCombatAuto();});
await test('Paladin remains unavailable before enemy damage or after death',async()=>{await fresh('paladin');c.lastAcceptedDamage=0;D.useHeroCombatAbility();check(!c.heroAbilityUsed);c.lastAcceptedDamage=2;p.currentHp=0;D.useHeroCombatAbility();check(!c.heroAbilityUsed);});
progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL '+results.filter(x=>!x.pass).length+'/'+results.length;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
