<!doctype html><meta charset="utf-8"><title>Online progression regression</title><style>body{background:#16201d;color:#ddd;font:14px system-ui}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style><h1>Online progression regression</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="host"></iframe><iframe id="guest"></iframe><script>
(async()=>{const results=[],check=(v,m='Assertion')=>{if(!v)throw Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));async function until(fn){for(let i=0;i<150;i++){if(fn())return;await wait(100)}throw Error('Timeout waiting for network')};async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
async function load(f){await new Promise(r=>{f.onload=r;f.src='../index.html?online-progression='+f.id});return f.contentWindow}
const a=await load(host),b=await load(guest),ad=a.document,bd=b.document;ad.getElementById('netName').value='Atlas test host';ad.getElementById('netCreate').click();await until(()=>ad.querySelector('[data-hero="archer"]'));ad.querySelector('[data-hero="archer"]').click();const code=ad.getElementById('roomCode').textContent.trim();bd.getElementById('netName').value='Atlas test guest';bd.getElementById('netCodeInput').value=code;bd.getElementById('netJoin').click();await until(()=>bd.querySelector('[data-hero="paladin"]'));bd.querySelector('[data-hero="paladin"]').click();await until(()=>!ad.getElementById('netStart').disabled);ad.getElementById('netStart').click();await until(()=>a.__RPG_ONLINE__.isStarted()&&b.__RPG_ONLINE__.isStarted());
const activeId=a.__RPG_ONLINE__.currentPlayerId(),active=activeId==='archer'?a:b,off=activeId==='archer'?b:a,offId=activeId==='archer'?'paladin':'archer',D=off.__RPG_DEBUG__,doc=off.document;
await test('Offturn hero receives authoritative XP from active client',async()=>{active.__RPG_DEBUG__.getPlayer(offId).masteryPoints=250;active.dispatchEvent(new active.Event('rpg-local-mutation'));await until(()=>D.getPlayer(offId).masteryPoints===250);check(off.__RPG_ONLINE__.currentPlayerId()!==offId)});
await test('Real offturn skill UI purchases and syncs to active player',async()=>{D.openCharacterSheet('overview',null,offId);doc.getElementById('heroSkillTree').click();await until(()=>doc.querySelector('.skill-node'));const p=D.getPlayer(offId),branch=off.RPGProgression.hero(offId).branches[0],id=branch.nodes[1].id;doc.querySelector(`[data-skill="${id}"]`).click();await until(()=>doc.querySelector('[data-learn]')&&!doc.querySelector('[data-learn]').disabled);doc.querySelector('[data-learn]').click();await until(()=>D.getPlayer(offId).learnedAbilities.includes(id));await until(()=>active.__RPG_DEBUG__.getPlayer(offId).learnedAbilities.includes(id));check(off.RPGProgression.info(D.getPlayer(offId)).points===0);check(doc.querySelector('.skill-detail-dialog').textContent.includes('Изучено'))});
await test('Offturn tree can close without affecting the active turn',()=>{doc.querySelector('.skill-detail-dialog [data-close]').click();doc.querySelector('.skill-tree-dialog .skill-footer [data-close]').click();check(!doc.querySelector('.skill-tree-dialog').open);check(active.__RPG_ONLINE__.currentPlayerId()===activeId)});
await test('Another hero tree is read only',async()=>{D.openHeroProgression(activeId);await wait(100);const branch=off.RPGProgression.hero(activeId).branches[0];doc.querySelector(`[data-skill="${branch.nodes[1].id}"]`).click();check(doc.querySelector('[data-learn]').disabled);check(doc.querySelector('.skill-detail-dialog').textContent.includes('другого героя'))});
off.RPGSkillTree.close();active.RPGSkillTree.close();
await test('Heart cleansing deadline is shared exactly and not extended by remote reload',async()=>{const ad=active.__RPG_DEBUG__,st=ad.getState(),hex=Object.keys(active.MAP_DATA.hexes).find(h=>active.MAP_DATA.hexes[h].region==='heart_of_darkness'&&h!==active.MAP_DATA.bossHex);ad.markExplorationSuccess(hex);const deadline=JSON.stringify(st.cleanedUntil[hex]);active.dispatchEvent(new active.Event('rpg-local-mutation'));await until(()=>JSON.stringify(off.__RPG_DEBUG__.getState().cleanedUntil?.[hex])===deadline);const snapshot=off.__RPG_ONLINE__.exportState();off.__RPG_ONLINE__.applyState(snapshot);check(JSON.stringify(off.__RPG_DEBUG__.getState().cleanedUntil[hex])===deadline);});
await test('Enemy stun appears for observer; only active client advances battle',async()=>{const ad=active.__RPG_DEBUG__;ad.combatStart(ad.CARD_BY_ID[1]);const c=ad.getState().combat;c.phase='enemy_ready';c.enemyStunned=1;ad.combatEnemyTurn();active.dispatchEvent(new active.Event('rpg-local-mutation'));await until(()=>off.__RPG_DEBUG__.getState().combat?.phase==='stun_notice');check(off.document.getElementById('combatStunNotice')?.textContent.includes('Разбойник с ножом'));await until(()=>active.__RPG_DEBUG__.getState().combat?.phase==='hero_turn');active.dispatchEvent(new active.Event('rpg-local-mutation'));await until(()=>off.__RPG_DEBUG__.getState().combat?.phase==='hero_turn');check(active.__RPG_DEBUG__.getState().combat.round===2&&off.__RPG_DEBUG__.getState().combat.round===2);check(off.__RPG_DEBUG__.getState().combat.enemyAttackCount===0);});
await test('Observer receives separate damage and status dice; only owner commits HP and effect',async()=>{const ad=active.__RPG_DEBUG__,p=ad.currentPlayer(),c=ad.getState().combat;active.Math.random=()=>.99;active.RPGDiceSettings.set({speed:2},p.id);c.enemyHp=100;c.enemyMaxHp=100;c.enemyStunned=0;c.enemyBleed=0;c.enemyPoison=0;c.enemyBurn=0;const branch=active.RPGProgression.hero(p.id).branches.find(b=>b.kind==='natural'),node=branch.nodes.find(n=>n.level===3&&active.RPGProgression.rules(n).dice);let q=node;while(q){p.learnedAbilities.push(q.id);q=branch.nodes.find(n=>n.id===q.parent)}c.phase='hero_damage_ready';c.attackRoll={chosen:20,natural:20,profile:{damage:'D6',weapon:null}};ad.combatRollHeroDamage();active.dispatchEvent(new active.Event('rpg-local-mutation'));await until(()=>off.__RPG_DEBUG__.getState().combat?.phase==='hero_damage');let remote=off.__RPG_DEBUG__.getState().combat;check(remote.enemyHp===100&&remote.lastRoll.dice.length===2);await until(()=>off.__RPG_DEBUG__.getState().combat?.phase==='effect_check');remote=off.__RPG_DEBUG__.getState().combat;check(remote.enemyHp===88&&remote.enemyStunned===0);check(remote.lastRoll.dice.length===1&&remote.lastRoll.dice[0].sides===6&&remote.lastRoll.detail.includes('5, 6'));await until(()=>off.__RPG_DEBUG__.getState().combat?.enemyStunned===1);check(off.__RPG_DEBUG__.getState().combat.enemyHp===88);ad.cancelCombatAuto();});
await test('Ability D20 and damage are synchronized to observer before HP changes',async()=>{const ad=active.__RPG_DEBUG__,p=ad.currentPlayer(),c=ad.getState().combat;c.enemyHp=100;c.enemyMaxHp=100;c.enemyStunned=0;c.heroAbilityUsed=false;c.phase=p.id==='paladin'?'post_damage':'hero_turn';c.paladinCounterOpportunity=p.id==='paladin';c.lastAcceptedDamage=2;active.Math.random=()=>.99;ad.useHeroCombatAbility();active.dispatchEvent(new active.Event('rpg-local-mutation'));await until(()=>off.__RPG_DEBUG__.getState().combat?.phase==='ability_attack');let remote=off.__RPG_DEBUG__.getState().combat;check(remote.enemyHp===100&&remote.lastRoll.dice[0].sides===20&&remote.abilityAttackRoll.profile.key===(p.id==='paladin'?'wis':'dex'));await until(()=>['ability_damage','paladin_counter'].includes(off.__RPG_DEBUG__.getState().combat?.phase));remote=off.__RPG_DEBUG__.getState().combat;check(remote.enemyHp===100&&remote.lastRoll.dice[0].sides!==20);await until(()=>off.__RPG_DEBUG__.getState().combat?.phase==='hero_turn');check(off.__RPG_DEBUG__.getState().combat.enemyHp<100);ad.cancelCombatAuto();});
await test('Round HP recovery and its marker synchronize and survive remote refresh',async()=>{const ad=active.__RPG_DEBUG__,st=ad.getState(),p=ad.currentPlayer();st.combat=null;st.round=2;st.rolled=false;st.turnLocked=false;p.currentHp=6;p.maxHp=12;delete p.lastRecoveryRound;ad.rollMove();active.dispatchEvent(new active.Event('rpg-local-mutation'));await until(()=>off.__RPG_DEBUG__.getPlayer(p.id).lastRecoveryRound===2);check(off.__RPG_DEBUG__.getPlayer(p.id).currentHp===7);const snapshot=off.__RPG_ONLINE__.exportState();off.__RPG_ONLINE__.applyState(snapshot);check(off.__RPG_DEBUG__.getPlayer(p.id).currentHp===7&&off.__RPG_DEBUG__.getPlayer(p.id).lastRecoveryRound===2);});
progress.textContent=results.every(x=>x.pass)?`PASS ${results.length}`:`FAIL ${results.filter(x=>!x.pass).length}/${results.length}`;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});
</script>
