<!doctype html><meta charset="utf-8"><title>Ability check responsive</title><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{const results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));for(const [width,height] of [[320,568],[390,844],[844,390],[1366,768]]){game.style.width=width+'px';game.style.height=height+'px';await new Promise(r=>{game.onload=r;game.src='preview.html?'+width});const end=Date.now()+8000;let w,c;while(Date.now()<end){w=game.contentWindow.document.getElementById('game')?.contentWindow;c=w?.__RPG_DEBUG__?.getState().combat;if(c?.phase==='ability_attack')break;await wait(20)}await wait(2000);const card=w.document.querySelector('.arcana-battle-card'),rect=card.getBoundingClientRect(),shadow=card.querySelector('[data-fantasy-dice]')?.shadowRoot,text=shadow?.textContent||'';results.push({name:width+'×'+height,pass:c.phase==='ability_attack'&&rect.left>=-1&&rect.right<=width+1&&rect.top>=-1&&rect.bottom<=height+1&&text.includes('ПОПАДАНИЕ')&&text.includes('ХАР'),rect:rect.toJSON(),hasResult:text.includes('ПОПАДАНИЕ')});report.textContent=JSON.stringify(results,null,2)}progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL';})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
