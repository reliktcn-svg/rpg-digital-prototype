<!doctype html><meta charset="utf-8"><title>Ability roll sequence</title><style>body{font:14px system-ui;background:#181b20;color:#eee}iframe{width:844px;height:650px}pre{white-space:pre-wrap}</style><h1>Ability and effect sequence</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{let w,d,D,A,P,s,p,c;const results=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,m='Assertion')=>{if(!v)throw Error(m)};
async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
async function fresh(id='rogue'){await new Promise(r=>{game.onload=r;game.src='../index.html?sequence='+Math.random()});w=game.contentWindow;d=w.document;D=w.__RPG_DEBUG__;A=w.__RPG_ONLINE__;P=w.RPGProgression;await w.RPGAtlas.ready;d.getElementById('netLocal').click();A.startWithHeroes([id]);s=D.getState();p=D.currentPlayer();p.masteryPoints=10000;D.ensurePlayerModel(p);w.Math.random=()=>.99;w.RPGDiceSettings.set({speed:4},id);D.combatStart(D.CARD_BY_ID[1]);c=s.combat;c.phase='hero_turn';c.enemyHp=100;c.enemyMaxHp=100;D.cancelCombatAuto()}
function learn(kind,level,status=-1){const b=P.hero(p.id).branches.find(b=>b.kind===kind&&(status<0||b.status===status));const n=b.nodes.find(n=>n.level===level);let q=n;while(q){if(!p.learnedAbilities.includes(q.id))p.learnedAbilities.push(q.id);q=b.nodes.find(x=>x.id===q.parent)}return n}
function clickPopup(){const b=d.getElementById('rollPopupClose');b.disabled=false;b.click()}
async function until(fn,timeout=8000){const end=Date.now()+timeout;while(!fn()){if(Date.now()>end)throw Error('Timeout; phase='+c.phase+' roll='+c.lastRoll?.title);await wait(20)}}
function visibleRoll(){return !!d.querySelector('.arcana-battle-layer:not([hidden])')}
for(const hero of ['rogue','archer','paladin'])await test(hero+' lethal ability: real window first, HP changes only when it closes, then victory',async()=>{await fresh(hero);c.enemyHp=1;p.currentHp=4;if(hero==='paladin'){c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2}D.renderCombat();d.getElementById('combatHeroAbility').click();check(visibleRoll(),'damage window missing');check(c.enemyHp===1&&!c.masteryAwarded,'premature damage/victory');const seq=c.lastRoll.seq;let visibleSamples=0;await until(()=>{if(visibleRoll()&&c.lastRoll.seq===seq){visibleSamples++;check(c.enemyHp===1&&!c.masteryAwarded,'damage while roll visible')}return !!c.masteryAwarded});check(visibleSamples>2);check(!visibleRoll(),'roll did not close');check(d.getElementById('rollPopupTitle').textContent==='Результаты боя');if(hero==='paladin')check(p.currentHp===5);});
for(const hero of ['rogue','archer'])for(const level of [3,4])for(const success of [false,true])await test(hero+' '+level+' '+(success?'successful':'failed')+' separate status check after damage',async()=>{await fresh(hero);const r=P.rules(learn('ability',level));D.renderCombat();d.getElementById('combatHeroAbility').click();check(c.enemyHp===100);const damageSeq=c.lastRoll.seq;check(c.lastRoll.dice.length===1,'check mixed with damage');w.Math.random=()=>success?.99:0;await until(()=>c.phase==='effect_check');check(c.enemyHp===100-(hero==='rogue'?12:level===3?10:12),'damage not applied before check: hp='+c.enemyHp+' rule='+JSON.stringify(r));check(c.lastRoll.seq>damageSeq&&c.lastRoll.dice.length===1&&c.lastRoll.dice[0].sides===r.chance.sides);check(!c.enemyBleed&&!c.enemyPoison,'effect before check closes');check(visibleRoll());check(c.lastRoll.detail.includes(success?'УСПЕХ':'ПРОВАЛ'));await until(()=>c.phase==='hero_turn');check(((hero==='rogue'?c.enemyBleed:c.enemyPoison)||0)===(success?(hero==='rogue'?2:6):0));check(c.heroAttackCount===0,'ability consumed ordinary attack');D.cancelCombatAuto();});
await test('Lethal Rogue III also shows separate check before results',async()=>{await fresh();learn('ability',3);c.enemyHp=1;D.useHeroCombatAbility();await until(()=>c.phase==='effect_check');check(c.enemyHp===0&&!c.masteryAwarded);check(visibleRoll()&&c.lastRoll.title==='Проверка · Кровотечение');await until(()=>!!c.masteryAwarded);check(!c.enemyBleed,'dead enemy received effect');});
for(const hero of ['rogue','archer'])await test(hero+' V guaranteed effect has no invented check roll',async()=>{await fresh(hero);learn('ability',5);D.useHeroCombatAbility();const seq=c.lastRoll.seq;await until(()=>c.phase==='hero_turn');check(c.lastRoll.seq===seq);check(hero==='rogue'?c.enemyBleed===2:c.enemyPoison===6);});
for(const hero of ['warrior','dwarf','mage','archer','rogue','paladin'])await test(hero+' Natural20 damage then independent stun check',async()=>{await fresh(hero);const b=P.hero(hero).branches.find(b=>b.kind==='natural'),n=b.nodes.find(n=>n.level===3&&P.rules(n).dice);let q=n;while(q){p.learnedAbilities.push(q.id);q=b.nodes.find(x=>x.id===q.parent)}c.phase='hero_damage_ready';c.attackRoll={chosen:20,natural:20,profile:{damage:'D6',weapon:null}};D.combatRollHeroDamage();check(c.enemyHp===100&&!c.enemyStunned);check(c.lastRoll.dice.length===2,'chance die mixed with damage');D.cancelCombatAuto();D.applyHeroDamageNow();check(c.enemyHp===88&&c.phase==='effect_check'&&!c.enemyStunned);check(c.lastRoll.dice.length===1&&c.lastRoll.dice[0].sides===6);D.resolveHeroEffectCheck();check(c.enemyStunned===1);D.cancelCombatAuto();});
for(const hero of ['warrior','dwarf','mage','archer','rogue','paladin'])await test(hero+' every resistance rank and status, combat and map, success/failure windows',async()=>{await fresh(hero);for(const combat of [true,false])for(let index=0;index<4;index++)for(const level of [1,2,3])for(const success of [false,true]){s.combat=combat?c:null;p.learnedAbilities=[];p.statuses=[];p.statusTimers={};c.heroStunned=0;c.phase='hero_turn';learn('resistance',level,index);const status=P.statusNames[index],rule=P.rules(P.selected(p,'resistance',index)).resistance;w.Math.random=()=>success?.99:0;const result=combat?D.combatApplyHeroStatus(p,status):D.addStatus(p,status);if(rule.immune){check(!result&&!p.statuses.includes(status));check(d.getElementById('rollOverlay').hidden)}else{check(result===!success&&p.statuses.includes(status)===!success,`${hero} ${status} ${level}`);check(!d.getElementById('rollOverlay').hidden);check(d.getElementById('rollPopupMath').textContent.includes('D'+rule.sides));check(d.getElementById('rollPopupDetail').textContent.includes(success?'УСПЕХ':'ПРОВАЛ'));clickPopup()}D.cancelCombatAuto()}s.combat=c;});
await test('Ability and effect pending stages round-trip without applying damage twice',async()=>{await fresh();learn('ability',3);D.useHeroCombatAbility();D.cancelCombatAuto();A.applyState(JSON.parse(JSON.stringify(A.exportState())));c=D.getState().combat;check(c.enemyHp===100&&c.pendingAbilityDamage);D.resolveHeroAbilityDamage();D.cancelCombatAuto();check(c.enemyHp===88&&c.phase==='effect_check');A.applyState(JSON.parse(JSON.stringify(A.exportState())));c=D.getState().combat;D.resolveHeroEffectCheck();D.cancelCombatAuto();check(c.enemyHp===88&&c.enemyBleed===2);D.resolveHeroAbilityDamage();D.resolveHeroEffectCheck();check(c.enemyHp===88&&c.enemyBleed===2);});
for(const hero of ['rogue','archer','paladin'])await test(hero+' damage waits for enemy rolled guard, then commits once',async()=>{await fresh(hero);c.cardId=44;c.enemyHp=1;p.currentHp=3;if(hero==='paladin'){c.phase='post_damage';c.paladinCounterOpportunity=true;c.lastAcceptedDamage=2}D.useHeroCombatAbility();w.Math.random=()=>0;await until(()=>c.phase==='enemy_guard_roll');check(c.enemyHp===1&&!c.masteryAwarded);check(c.lastRoll.title.includes('Защита врага'));check(visibleRoll());w.Math.random=()=>0;await until(()=>!!c.masteryAwarded);check(c.enemyHp===0);});
await test('Reflected D8 from book waits for its own window, including victory',async()=>{await fresh('mage');p.equipment.weapon=338;p.currentHp=8;c.enemyHp=1;c.phase='enemy_damage';c.pendingEnemyDamage={amount:1};D.acceptEnemyDamage();check(c.phase==='secondary_damage'&&c.enemyHp===1&&!c.masteryAwarded);check(c.lastRoll.title.includes('Книга Отражённого Пламени')&&visibleRoll());await until(()=>!!c.masteryAwarded);check(c.enemyHp===0);});
await test('Mirror retaliation waits for its own D8, including victory',async()=>{await fresh();c.mirrorQueued=true;c.enemyHp=1;c.phase='enemy_damage';c.pendingEnemyDamage={amount:1};D.acceptEnemyDamage();check(c.phase==='secondary_damage'&&c.enemyHp===1&&!c.masteryAwarded);check(c.lastRoll.title.includes('Зеркало мрака'));await until(()=>!!c.masteryAwarded);});
await test('Enemy natural one self-damage waits for visible D4 before victory',async()=>{await fresh();c.cardId=24;c.enemyHp=1;c.phase='enemy_roll';c.enemyAttackRoll={chosen:1,natural:1,total:1,target:12};D.finalizeEnemyAttackRoll();check(c.phase==='secondary_damage'&&c.enemyHp===1&&!c.masteryAwarded);check(c.lastRoll.diceHeroId===null&&visibleRoll());await until(()=>!!c.masteryAwarded);});
await test('Enemy hit resistance finishes before the next combat damage animation',async()=>{await fresh('warrior');learn('resistance',1,0);c.phase='enemy_roll';c.enemyAttackRoll={chosen:20,natural:20,total:22,target:13};D.finalizeEnemyAttackRoll();check(!d.getElementById('rollOverlay').hidden);check(d.getElementById('rollPopupTitle').textContent.includes('Сопротивление'));check(!visibleRoll(),'overlapping combat roll');const before=p.currentHp;await wait(400);check(p.currentHp===before);await until(()=>d.getElementById('rollOverlay').hidden);check(visibleRoll(),'damage roll did not resume');await until(()=>!visibleRoll());D.cancelCombatAuto();});
for(const level of [1,2,3,4,5])await test('Rogue '+level+' every face: one die multiplied by two, never two damage dice',async()=>{await fresh();learn('ability',level);const sides=level===1?4:6;for(let face=1;face<=sides;face++){c.phase='hero_turn';c.heroAbilityUsed=false;c.enemyHp=100;c.queuedHeroEffects=[];delete c.pendingEffectCheck;w.Math.random=()=>(face-.5)/sides;D.useHeroCombatAbility();D.cancelCombatAuto();check(c.lastRoll.dice.length===1&&c.lastRoll.dice[0].sides===sides&&c.lastRoll.dice[0].value===face);check(c.pendingAbilityDamage.amount===face*2);check(c.lastRoll.math.includes('× 2 = '+(face*2)));check(c.enemyHp===100);D.resolveHeroAbilityDamage();D.cancelCombatAuto();check(c.enemyHp===100-face*2);}});
await test('Every hero D6 chance/resistance succeeds only on 5 and 6; D4 unchanged',async()=>{await fresh();for(const hero of ['warrior','dwarf','mage','archer','rogue','paladin'])for(const branch of P.hero(hero).branches)for(const node of branch.nodes){const r=P.rules(node),rule=r.chance||r.resistance;if(rule?.sides===6)check(JSON.stringify(rule.success)==='[5,6]',hero+' '+node.id);if(rule?.sides===4)check(JSON.stringify(rule.success)==='[3,4]',hero+' '+node.id)}for(const face of [4,5,6]){c.phase='hero_turn';c.heroAbilityUsed=false;c.enemyHp=100;c.enemyBleed=0;c.queuedHeroEffects=[];p.learnedAbilities=[];learn('ability',3);D.useHeroCombatAbility();D.cancelCombatAuto();w.Math.random=()=>(face-.5)/6;D.resolveHeroAbilityDamage();D.cancelCombatAuto();check(c.pendingEffectCheck.success===(face>=5));D.resolveHeroEffectCheck();D.cancelCombatAuto();check(c.enemyBleed===(face>=5?2:0));}});
D.cancelCombatAuto();progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL '+results.filter(x=>!x.pass).length+'/'+results.length;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
