<!doctype html><meta charset="utf-8"><title>Round recovery checks</title><p id="progress">Running</p><pre id="report"></pre><iframe id="game" style="width:390px;height:700px"></iframe><script>
(async()=>{let w,d,D,A,s,p;const results=[],check=(v,m='Assertion')=>{if(!v)throw Error(m)};async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
async function fresh(heroes=['archer']){await new Promise(r=>{game.onload=r;game.src='../index.html?recovery='+Math.random()});w=game.contentWindow;d=w.document;D=w.__RPG_DEBUG__;A=w.__RPG_ONLINE__;await w.RPGAtlas.ready;d.getElementById('netLocal').click();A.startWithHeroes(heroes);s=D.getState();p=D.currentPlayer();p.maxHp=12;p.currentHp=6;p.gold=1000;w.Math.random=()=>.45;}
function nextRound(){for(let i=0;i<s.order.length;i++)D.advanceTurnState(D.currentPlayer());}
function buildHex(){const hex=Object.keys(w.MAP_DATA.hexes).find(h=>{s.cleaned[h]=true;return D.canBuildAt(p,h).ok});check(hex,'no valid build hex');p.hex=hex;return hex}
await test('No recovery on first turn; next movement click changes 6/12 to 7/12, double click does not heal again',async()=>{await fresh();D.rollMove();check(p.currentHp===6);nextRound();check(p.currentHp===6);D.rollMove();check(p.currentHp===7&&p.lastRecoveryRound===2);D.rollMove();check(p.currentHp===7)});
await test('Three players wait for complete round; each hero heals independently',async()=>{await fresh(['archer','rogue','paladin']);for(const q of s.players){q.maxHp=12;q.currentHp=6}for(let i=0;i<3;i++){const q=D.currentPlayer();D.rollMove();check(q.currentHp===6);D.advanceTurnState(q)}for(let i=0;i<3;i++){const q=D.currentPlayer();D.rollMove();check(q.currentHp===7&&q.lastRecoveryRound===2);D.advanceTurnState(q)}check(s.players.every(q=>q.currentHp===7))});
await test('Building without movement heals before +2 maximum HP and advances the turn',async()=>{await fresh();nextRound();buildHex();D.buildTerritory();check(p.currentHp===7&&p.maxHp===14&&s.round===3&&p.lastRecoveryRound===2)});
await test('Invalid/unaffordable building does not heal',async()=>{await fresh();nextRound();buildHex();p.gold=0;D.buildTerritory();check(p.currentHp===6&&!p.lastRecoveryRound&&s.round===2)});
await test('Area merger without movement heals once; building and merging cannot repeat recovery',async()=>{await fresh();nextRound();const hexes=Object.keys(w.MAP_DATA.hexes).filter(h=>w.MAP_DATA.hexes[h].region==='kingdom');for(const h of hexes)s.territories[h]={owner:p.id,areaId:null};p.hex=hexes.find(h=>D.areaCandidatesAt(p,h).length);const triple=D.areaCandidatesAt(p)[0];check(triple);D.finalizeArea(p,triple,{type:'defense',amount:1},20,()=>D.advanceTurnState(p));check(p.currentHp===7&&s.round===3);D.beginSideInteraction(p,'victory',[p.id]);D.buildTerritoryFor(p,hexes.find(h=>!triple.includes(h)),10);check(p.currentHp===7,'offturn solo build healed next round');D.endSideInteraction();D.rollMove();check(p.currentHp===8)});
await test('Movement then valid building grants no second recovery in same round',async()=>{await fresh();nextRound();D.rollMove();buildHex();D.buildTerritory();check(p.currentHp===7&&p.lastRecoveryRound===2)});
await test('Trade that hands over turn heals only the initiator, once',async()=>{await fresh(['archer','rogue']);nextRound();const other=s.players.find(q=>q!==p);other.currentHp=4;const round=s.round;D.openTrade();check(p.currentHp===7&&other.currentHp===4&&D.currentPlayer().id!==p.id&&p.lastRecoveryRound===round);D.openTrade(p,false);check(p.currentHp===7&&other.currentHp===4)});
await test('Trade without handoff or without another hero does not heal',async()=>{await fresh(['archer','rogue']);nextRound();D.openTrade(p,false);check(p.currentHp===6);await fresh();nextRound();D.openTrade();check(p.currentHp===6)});
await test('Recovery caps at max and is consumed even at full HP; no stockpiled healing',async()=>{await fresh();s.round=10;p.currentHp=12;D.rollMove();check(p.currentHp===12&&p.lastRecoveryRound===10);p.currentHp=6;s.rolled=false;D.rollMove();check(p.currentHp===6);nextRound();D.rollMove();check(p.currentHp===7)});
await test('Save/load retains recovery marker and cannot grant another HP',async()=>{await fresh();nextRound();D.rollMove();const snap=A.exportState();A.applyState(snap);s=D.getState();p=D.currentPlayer();s.rolled=false;D.rollMove();check(p.currentHp===7&&p.lastRecoveryRound===2)});
await test('Recovery precedes poison/burning; bleeding does not tick outside combat',async()=>{await fresh();nextRound();D.addStatus(p,'Яд');D.addStatus(p,'Горение');D.addStatus(p,'Кровотечение');D.rollMove();check(p.currentHp===4,'6+1-1-2');check(p.statusTimers['Яд']===5&&p.statusTimers['Горение']===2&&p.statusTimers['Кровотечение']===2)});
await test('Dungeon exit heals once; bonus exploration turn grants no second recovery',async()=>{await fresh();nextRound();p.inDungeon=true;p.dungeonEnteredTurn=1;p.personalTurn=2;w.Math.random=()=>.99;D.attemptDungeonExit('dex');check(p.currentHp===7&&p.lastRecoveryRound===2);D.beginBonusExplorationTurnAfterDungeon(p);D.rollMove();check(p.currentHp===7)});
await test('Combat, dead heroes and offturn players cannot receive round recovery',async()=>{await fresh(['archer','rogue']);nextRound();const other=s.players.find(q=>q!==p);other.currentHp=4;D.recoverHealthForRound(other);check(other.currentHp===4);D.combatStart(D.CARD_BY_ID[1]);D.recoverHealthForRound(p);check(p.currentHp===6);D.cancelCombatAuto();s.combat=null;p.currentHp=0;D.recoverHealthForRound(p);check(p.currentHp===0)});
progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL '+results.filter(x=>!x.pass).length+'/'+results.length;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
