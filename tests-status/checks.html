<!doctype html><meta charset="utf-8"><title>Status and heart rules</title><style>body{background:#181b20;color:white;font:14px system-ui}iframe{width:390px;height:844px}pre{white-space:pre-wrap}</style><h1>Effects and heart regression</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{let w,d,D,A,P,s,p,c;const results=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,m='Assertion')=>{if(!v)throw Error(m)},eq=(a,b,m='')=>check(JSON.stringify(a)===JSON.stringify(b),m+' '+JSON.stringify(a)+' != '+JSON.stringify(b));
async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
async function fresh(combat=true,heroes=['warrior']){await new Promise(r=>{game.onload=r;game.src='../index.html?status-tests='+Math.random()});w=game.contentWindow;d=w.document;D=w.__RPG_DEBUG__;A=w.__RPG_ONLINE__;P=w.RPGProgression;await w.RPGAtlas.ready;d.getElementById('netLocal').click();A.startWithHeroes(heroes);s=D.getState();p=D.currentPlayer();w.Math.random=()=>.49;if(combat){D.combatStart(D.CARD_BY_ID[1]);c=s.combat;c.phase='hero_turn';c.enemyHp=100;c.enemyMaxHp=100;D.cancelCombatAuto()}else c=null}
function clickPopup(){const b=d.getElementById('rollPopupClose');b.disabled=false;b.click()}
function heart(){return Object.keys(w.MAP_DATA.hexes).find(h=>w.MAP_DATA.hexes[h].region==='heart_of_darkness'&&h!==w.MAP_DATA.bossHex&&!s.locations[h])}
await test('Heart solo: expires after exactly three turn advances; forces research on reentry',async()=>{await fresh(false);const h=heart();p.hex=h;D.markExplorationSuccess(h);eq(D.heartCleansingRemaining(h),3);for(let i=0;i<2;i++){D.advanceTurnState(D.currentPlayer());check(s.cleaned[h]);}eq(D.heartCleansingRemaining(h),1);D.advanceTurnState(D.currentPlayer());check(!s.cleaned[h]&&!s.cleanedUntil[h]);s.turnMoved=true;check(D.currentHexNeedsResolution(p));check(s.journal.some(x=>JSON.stringify(x).includes('три круга')));});
await test('Heart three heroes: exact initiative position, not merely start of round',async()=>{await fresh(false,['warrior','mage','paladin']);s.currentIndex=2;p=D.currentPlayer();const h=heart();D.markExplorationSuccess(h);for(let i=0;i<8;i++)D.advanceTurnState(D.currentPlayer());check(s.cleaned[h]);D.advanceTurnState(D.currentPlayer());check(!s.cleaned[h]);});
await test('Heart repeat victory renews lifetime; outer regions permanent; legacy saves migrate once',async()=>{await fresh(false);const h=heart(),outside='ТК110';D.markExplorationSuccess(h);D.markExplorationSuccess(outside);D.advanceTurnState(p);D.advanceTurnState(p);D.markExplorationSuccess(h);eq(D.heartCleansingRemaining(h),3);const deadline=JSON.stringify(s.cleanedUntil[h]);const saved=A.exportState();A.applyState(JSON.parse(JSON.stringify(saved)));s=D.getState();p=D.currentPlayer();eq(JSON.stringify(s.cleanedUntil[h]),deadline);D.advanceTurnState(p);check(s.cleaned[h]&&s.cleaned[outside]);delete s.cleanedUntil;D.updateUI();eq(D.heartCleansingRemaining(h),3);const migrated=JSON.stringify(s.cleanedUntil[h]);D.updateUI();eq(JSON.stringify(s.cleanedUntil[h]),migrated);});
await test('Hero: poison 6×1, bleeding 2×3, burning 3×2 before enemy roll, never after own hit',async()=>{await fresh();for(const st of ['Яд','Кровотечение','Горение'])D.combatApplyHeroStatus(p,st);eq(p.statusTimers,{'Яд':6,'Кровотечение':2,'Горение':3});p.maxHp=100;p.currentHp=100;c.phase='hero_damage';c.pendingHeroDamage={amount:1,profile:{damage:'D6'}};D.applyHeroDamageNow();eq(p.currentHp,100);D.cancelCombatAuto();c.phase='enemy_ready';D.combatEnemyTurn();eq(p.currentHp,94);eq(c.phase,'enemy_roll');eq(p.statusTimers,{'Яд':5,'Кровотечение':1,'Горение':2});D.cancelCombatAuto();for(let round=2;round<=6;round++){c.round=round;c.phase='enemy_ready';D.combatEnemyTurn();D.cancelCombatAuto()}eq(p.currentHp,82);check(!p.statuses.some(st=>['Яд','Кровотечение','Горение'].includes(st)));});
await test('Enemy status ticks after miss, once per turn, with exact damage and expiry',async()=>{await fresh();for(const st of ['Яд','Кровотечение','Горение'])D.combatApplyEnemyStatus(st);eq([c.enemyPoison,c.enemyBleed,c.enemyBurn],[6,2,3]);c.phase='enemy_miss';D.combatContinueAfterEnemyMiss();eq(c.enemyHp,94);eq([c.enemyPoison,c.enemyBleed,c.enemyBurn],[5,1,2]);for(let i=2;i<=6;i++){c.phase='enemy_miss';D.combatContinueAfterEnemyMiss()}eq(c.enemyHp,82);eq([c.enemyPoison,c.enemyBleed,c.enemyBurn],[0,0,0]);});
await test('Enemy status ticks immediately after accepted attack before Paladin counter, not again after it',async()=>{await fresh(true,['paladin']);D.combatApplyEnemyStatus('Яд');c.phase='enemy_damage';c.pendingEnemyDamage={amount:1};D.acceptEnemyDamage();eq(c.enemyHp,99);eq(c.enemyPoison,5);eq(c.phase,'post_damage');D.combatContinueAfterDamage();eq(c.enemyHp,99);eq(c.enemyPoison,5);});
await test('Outside: movement click ticks poison/burning; no bleeding and no end-turn tick',async()=>{await fresh(false);p.maxHp=100;p.currentHp=100;for(const st of ['Яд','Горение','Кровотечение'])D.addStatus(p,st);D.rollMove();eq(p.currentHp,97);eq([p.statusTimers['Яд'],p.statusTimers['Горение'],p.statusTimers['Кровотечение']],[5,2,2]);D.rollMove();eq(p.currentHp,97);D.advanceTurnState(p);eq(p.currentHp,97);D.rollMove();eq(p.currentHp,94);});
await test('Dungeon attempt ticks before the roll; duplicate clicks cannot tick or roll again',async()=>{await fresh(false);p.inDungeon=true;p.dungeonEnteredTurn=0;D.addStatus(p,'Яд');D.addStatus(p,'Горение');const hp=p.currentHp;D.attemptDungeonExit('str');eq(p.currentHp,hp-3);D.attemptDungeonExit('str');eq(p.currentHp,hp-3);});
await test('Lethal poison cancels movement and enemy attack',async()=>{await fresh(false);p.currentHp=1;D.addStatus(p,'Яд');D.rollMove();check(!s.rolled&&p.hex===w.MAP_DATA.startHex);await fresh();p.currentHp=1;D.combatApplyHeroStatus(p,'Яд');c.phase='enemy_ready';D.combatEnemyTurn();check(s.combat===null);eq(c.enemyAttackCount,0);});
await test('Hero stun announces at start of turn, closes at two seconds, then opponent turn',async()=>{await fresh();w.__RPG_HERO_PLAYER_NAMES__={warrior:'Артур'};c.phase='post_damage';D.combatApplyHeroStatus(p,'Оглушение');c.phase='hero_turn';D.renderCombat();eq(c.phase,'stun_notice');check(d.getElementById('combatStunNotice').textContent.includes('Воин — Артур'));await wait(1500);check(d.getElementById('combatStunNotice'));await wait(650);check(!d.getElementById('combatStunNotice'));eq(c.phase,'enemy_ready');D.cancelCombatAuto();eq(c.heroAttackCount,0);});
await test('Enemy stun announces, skips attack and returns to hero automatically',async()=>{await fresh();D.combatApplyEnemyStatus('Оглушение');c.phase='enemy_ready';D.combatEnemyTurn();eq(c.phase,'stun_notice');check(d.getElementById('combatStunNotice').textContent.includes('Разбойник с ножом'));await wait(2150);check(!d.getElementById('combatStunNotice'));eq(c.phase,'hero_turn');eq(c.enemyAttackCount,0);});
await test('Resistance has separate die, visible verdict, and pauses battle until result closes',async()=>{await fresh();const b=P.hero(p.id).branches.find(b=>b.kind==='resistance'&&b.status===1);p.learnedAbilities.push(b.nodes[0].id);w.Math.random=()=>.99;eq(D.combatApplyHeroStatus(p,'Яд'),false);check(d.getElementById('rollOverlay').classList.contains('status-check-popup'));check(d.getElementById('rollPopupDetail').textContent.includes('УСПЕХ — эффект предотвращён'));c.phase='enemy_ready';D.renderCombat();await wait(1600);eq(c.enemyAttackCount,0);check(w.getComputedStyle(d.getElementById('rollPopupDetail')).display!=='none');clickPopup();D.cancelCombatAuto();});
for(const id of [168,245])await test('Equipment '+id+' explicit resistance check prevents status and displays outcome',async()=>{await fresh();p.equipment.rings[0]=id;c.phase='enemy_damage';c.pendingEnemyDamage={amount:2};D.combatApplyHeroStatus(p,'Яд');w.Math.random=()=>.99;D.applyCombatItemEffect(p,id,{where:'equipment',slot:'ring0'});check(!p.statuses.includes('Яд'));check(d.getElementById('rollOverlay').classList.contains('status-check-popup'));check(d.getElementById('rollPopupDetail').textContent.includes('УСПЕХ'));check(c.used['item:'+id]);});
await test('Card 246 offered after successful attack; heals D4 once, disabled at full HP',async()=>{await fresh();p.equipment.amulet=246;p.currentHp=3;c.phase='hero_damage';c.pendingHeroDamage={amount:3,profile:{damage:'D6'}};check(D.combatDecisionOptions().some(x=>x.label.includes('Кровавый медальон')));D.applyCombatItemEffect(p,246,{where:'equipment',slot:'amulet'});eq(p.currentHp,5);eq(c.pendingHeroDamage.amount,3);check(c.used['item:246']);check(!D.combatDecisionOptions().some(x=>x.label.includes('Кровавый медальон')));await fresh();p.equipment.amulet=246;c.phase='hero_damage';c.pendingHeroDamage={amount:3};check(!D.combatDecisionOptions().some(x=>x.label.includes('Кровавый медальон')));});
await test('One-combat armor ignore is optional and consumed, permanent immunity stays permanent',async()=>{await fresh();p.equipment.armor=227;c.phase='enemy_damage';c.pendingEnemyDamage={amount:2};check(D.combatApplyHeroStatus(p,'Оглушение'));check(D.combatDecisionOptions().some(x=>x.label.includes('Тёмные латы')));D.applyCombatItemEffect(p,227,{where:'equipment',slot:'armor'});check(!p.statuses.includes('Оглушение'));check(D.combatApplyHeroStatus(p,'Оглушение'));check(!D.supportedCombatEffect(p,D.CARD_BY_ID[227],{where:'equipment',slot:'armor'}).enabled);p.equipment.armor=339;eq(D.combatApplyHeroStatus(p,'Оглушение'),false);});
await test('Card 246 real combat choice heals before killing blow and respects curse',async()=>{await fresh();p.equipment.amulet=246;p.currentHp=3;c.phase='hero_damage';c.enemyHp=1;c.pendingHeroDamage={amount:10,profile:{damage:'D6'}};D.renderCombat();const button=[...d.querySelectorAll('[data-auto-choice]')].find(b=>b.textContent.includes('Кровавый медальон'));check(button);button.click();eq(p.currentHp,5);D.applyHeroDamageNow();check(c.masteryAwarded&&p.currentHp===5);await fresh();p.equipment.amulet=246;p.currentHp=3;p.statuses=['Проклятие'];c.phase='hero_damage';c.pendingHeroDamage={amount:3};D.applyCombatItemEffect(p,246,{where:'equipment',slot:'amulet'});eq(p.currentHp,4);});
await test('Saved effect timers survive round-trip and old bleeding is capped to two',async()=>{await fresh();D.combatApplyHeroStatus(p,'Яд');D.combatApplyEnemyStatus('Кровотечение');p.statusTimers['Яд']=4;c.enemyBleed=3;const snapshot=JSON.parse(JSON.stringify(A.exportState()));A.applyState(snapshot);s=D.getState();p=D.currentPlayer();c=s.combat;eq(p.statusTimers['Яд'],4);eq(c.enemyBleed,2);});
await test('Failed resistance leaves status and explains failure',async()=>{await fresh();const b=P.hero(p.id).branches.find(b=>b.kind==='resistance'&&b.status===1);p.learnedAbilities.push(b.nodes[0].id);w.Math.random=()=>0;check(D.combatApplyHeroStatus(p,'Яд'));eq(p.statusTimers['Яд'],6);check(d.getElementById('rollPopupDetail').textContent.includes('ПРОВАЛ — эффект получен'));});
D.cancelCombatAuto();progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL '+results.filter(x=>!x.pass).length+'/'+results.length;
})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
