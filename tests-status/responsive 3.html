<!doctype html><meta charset="utf-8"><title>Status responsive</title><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{const results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));for(const [width,height] of [[320,568],[390,844],[844,390],[1366,768]])for(const mode of ['stun','resist']){game.style.width=width+'px';game.style.height=height+'px';await new Promise(r=>{game.onload=r;game.src='preview.html?'+mode});await wait(mode==='resist'?2000:500);const d=game.contentWindow.document.getElementById('game').contentDocument,notice=d.querySelector(mode==='stun'?'#combatStunNotice':'.roll-popup-card'),detail=mode==='resist'?d.getElementById('rollPopupDetail'):notice;const inside=el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.left>=-1&&r.right<=width+1&&r.top>=-1&&r.bottom<=height+1};results.push({name:mode+' '+width+'×'+height,pass:inside(notice)&&inside(detail)&&d.defaultView.getComputedStyle(detail).visibility!=='hidden',notice:notice?.getBoundingClientRect().toJSON(),detail:detail?.getBoundingClientRect().toJSON()});report.textContent=JSON.stringify(results,null,2)}progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL';})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
