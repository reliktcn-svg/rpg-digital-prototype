<!doctype html><meta charset="utf-8"><style>body{display:flex;flex-direction:column}iframe{order:-1;flex-shrink:0}</style><pre id="report">Running</pre><iframe id="game" width="1200" height="850"></iframe><script>
(async()=>{const q=new URLSearchParams(location.search);game.width=q.get('w')||1200;game.height=q.get('h')||850;const results=[],check=(v,m)=>{if(!v)throw Error(m)},test=async(n,f)=>{try{await f();results.push([n,'PASS'])}catch(e){results.push([n,e.stack])}report.textContent=JSON.stringify(results,null,2)};
await new Promise(r=>{game.onload=r;game.src='../index.html?test124=1'});const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__,B=w.RPGBoss;d.querySelector('#netLocal').click();D.startGame(['warrior']);const s=D.getState(),p=D.currentPlayer();
await test('Boss button opens unknown card; second click closes',()=>{const btn=d.querySelector('[data-table-boss]');check(btn,'boss button');btn.click();check(!d.querySelector('#bossInfoOverlay').hidden,'not open');check(d.querySelector('.boss-info-art img').src.includes('boss_unknown.webp'),'no silhouette');check(!d.querySelector('.boss-info-stat'),'circles remain');btn.click();check(d.querySelector('#bossInfoOverlay').hidden,'not toggled closed')});
await test('Back: exactly six locked rows',()=>{D.toggleBossInfo();d.querySelector('[data-boss-flip]').click();check(d.querySelectorAll('.boss-info-rows>div').length===6,'six rows');check([...d.querySelectorAll('.boss-info-rows dd')].every(e=>e.textContent==='—'),'secret leaked')});
await test('Reveal type only; art selected by boss key',()=>{p.masteryPoints=w.RPGProgression.threshold(2);D.syncBossClues();check(B.reveal(s,0),'reveal');D.updateUI();const vals=[...d.querySelectorAll('.boss-info-rows dd')].map(e=>e.textContent);check(vals[0]==='Найдена подсказка');check(vals.slice(1).every(v=>v==='—'));d.querySelector('[data-boss-flip]').click();check(d.querySelector('.boss-info-art img').getAttribute('src')==='assets/bosses/boss_'+s.boss.key+'.webp')});
await test('Actual clue card reveals shared data and keeps exploration',()=>{p.masteryPoints=w.RPGProgression.threshold(4);D.syncBossClues();s.exploration={hero:p.id,hex:p.hex,deckKey:'exploreOuter'};D.resolveBossClue(D.CARD_BY_ID[491]);check(s.boss.found.length===2);check(s.exploration,'exploration lost');check(d.querySelector('#modalContent').textContent.includes('Продолжить исследование'));check(!d.querySelector('#modalContent').textContent.includes('Открыто:'),'answer leaked');check(!s.decks.exploreHeart.draw.includes(492),'second copy retained');const button=d.querySelector('#modalActions button');let parent=button.parentElement;while(parent&&parent!==d.body){if(parent.scrollHeight>parent.clientHeight&&/auto|scroll/.test(w.getComputedStyle(parent).overflowY))parent.scrollTop=parent.scrollHeight;parent=parent.parentElement}const rect=button.getBoundingClientRect();check(rect.top>=0&&rect.bottom<=w.innerHeight,'clue continue inaccessible after scrolling')});
await test('Four clues unlock; save roundtrip preserves boss',()=>{p.masteryPoints=w.RPGProgression.threshold(15);for(let i=2;i<4;i++){D.syncBossClues();check(B.reveal(s,i))}D.updateUI();check(D.heartAccessAllowed());check(d.querySelector('#bossInfoOverlay').textContent.includes('Проход в Сердце тьмы открыт'));const saved=D.exportOnlineState();D.normalizeIncomingState(saved);check(JSON.stringify(saved.boss)===JSON.stringify(D.getState().boss),'boss changed')});
await test('Popup stays inside viewport and close controls reachable',()=>{const panel=d.querySelector('.boss-info-panel'),r=panel.getBoundingClientRect();check(r.top>=d.querySelector('#turnOrderBanner').getBoundingClientRect().bottom&&r.bottom<=w.innerHeight+1,'vertical overflow/header overlap');check(!panel.querySelector('header button'),'top close remains');check(!panel.querySelector('footer [data-boss-flip]'),'flip button remains');check(r.left>=0&&r.right<=w.innerWidth+1,'horizontal overflow');panel.scrollTop=panel.scrollHeight;const button=panel.querySelector('footer [data-boss-close]'),br=button.getBoundingClientRect();check(br.bottom<=w.innerHeight+1,'close outside');button.click();check(d.querySelector('#bossInfoOverlay').hidden)});
if(q.has('art'))await test('All 33 boss images load',async()=>{for(const v of B.variants)await new Promise((res,rej)=>{const img=new w.Image();img.onload=()=>{try{check(img.naturalWidth===img.naturalHeight,'not square '+v.key);res()}catch(e){rej(e)}};img.onerror=()=>rej(Error('missing '+v.key));img.src='../assets/bosses/boss_'+v.key+'.webp'})});
await test('Six unique clue images and complete lore',async()=>{for(let i=1;i<=6;i++)await new Promise((res,rej)=>{const img=new w.Image();img.onload=()=>img.naturalWidth>=1024&&img.naturalWidth===img.naturalHeight?res():rej(Error('size'));img.onerror=rej;img.src='../assets/story/boss_clue_'+i+'.webp'});check(w.RPGBossLore.types.length===33)});
await test('Lich check only after entering and before combat',async()=>{D.startGame(['warrior']);const hero=D.currentPlayer();D.combatStart(D.CARD_BY_ID[55]);D.cancelCombatAuto();check(D.getState().combat.phase==='pre');check(d.querySelector('#rollOverlay').hidden,'early check');D.combatFight();check(D.getState().combat.phase==='entry_check');check(!d.querySelector('#rollOverlay').hidden);await new Promise((res,rej)=>{let n=0;const timer=setInterval(()=>{if(!d.querySelector('#rollPopupClose').disabled){clearInterval(timer);res()}else if(++n>150){clearInterval(timer);rej(Error('dice timeout'))}},100)});d.querySelector('#rollPopupClose').click();D.cancelCombatAuto();check(D.getState().combat.entryCheckDone);check(D.getState().combat.phase==='hero_turn','battle not resumed')});
await test('Light shard offers a choice and closes after selection',()=>{D.startGame(['warrior']);const gs=D.getState(),hero=D.currentPlayer();gs.exploration={hero:hero.id,hex:hero.hex,deckKey:'exploreHeart'};hero.statuses=['Яд'];D.resolveEvent(D.CARD_BY_ID[113]);let btns=[...d.querySelectorAll('#modalActions button')];check(btns.length===2&&btns[0].textContent==='Снять эффект'&&btns[1].textContent==='+2 к атаке');btns[0].click();check(!hero.statuses.length&&d.querySelector('#modal').hidden);D.resolveEvent(D.CARD_BY_ID[113]);d.querySelectorAll('#modalActions button')[1].click();check(hero.combatEffects.some(e=>e.type==='nextBattleFlatAttack'));check(d.querySelector('#modal').hidden);gs.exploration=null});
await test('Elite victory has normal gold; defeat removes equipment',()=>{D.startGame(['warrior']);let gs=D.getState(),hero=D.currentPlayer();gs.exploration={hero:hero.id,hex:hero.hex,deckKey:'exploreHeart',elitePending:true};D.combatStart(D.CARD_BY_ID[1]);const before=hero.gold;D.combatVictory();check(hero.gold-before===Number(D.CARD_BY_ID[1].fields['Золото']),'elite doubled gold');D.startGame(['warrior']);gs=D.getState();hero=D.currentPlayer();D.setSlotId(hero,'weapon',141);gs.exploration={hero:hero.id,hex:hero.hex,deckKey:'exploreHeart',elitePending:true};D.combatStart(D.CARD_BY_ID[1]);hero.currentHp=0;D.combatHeroDeath('test');check(!hero.equipment.weapon,'elite defeat retained item');d.querySelector('#modal').hidden=true;d.querySelector('#rollOverlay').hidden=true});
await test('Final boss uses party stats and victory completes game',()=>{D.startGame(['warrior']);const gs=D.getState(),hero=D.currentPlayer();hero.hex=w.MAP_DATA.bossHex;check(!D.startBossBattle(hero),'entered before four clues');gs.boss.found=[0,1,2,3];gs.boss.heartUnlocked=true;hero.masteryPoints=w.RPGProgression.threshold(30);check(D.startBossBattle(hero),'boss did not start');D.cancelCombatAuto();const c=gs.combat;check(c.enemyMaxHp===gs.boss.hp,'scaled fixed HP');D.combatFight();D.cancelCombatAuto();check(gs.boss.fullyRevealed,'boss fight did not reveal all');check(B.view(gs.boss).every(v=>v!=='Найдена подсказка'&&v!=='—'));check(c.enemyFields['Тип']===gs.boss.types.join(' + '),'wrong type');check(d.querySelector('.tabletop-battle-card.enemy img')?.getAttribute('src')==='assets/bosses/boss_'+gs.boss.key+'.webp','wrong combat art');c.pendingResolvedDamage={kind:'ability',hit:{rule:{},returnPhase:'hero_turn'},amount:c.enemyHp,reduction:0};D.commitEnemyDamage();check(c.phase==='victory'&&c.victory.boss,'not boss victory');check(gs.gameWon?.heroId===hero.id,'winner missing');D.finishCombatVictory();check(gs.gameOver?.winnerId===hero.id,'game not completed');check(!gs.combat,'combat retained')});
if(q.has('preview')){d.querySelector('#modal').hidden=true;d.querySelector('#rollOverlay').hidden=true;D.startGame(['warrior']);if(q.get('preview')==='clue'){const s=D.getState();D.currentPlayer().masteryPoints=w.RPGProgression.threshold(2);D.syncBossClues();s.exploration={hero:D.currentPlayer().id,hex:D.currentPlayer().hex,deckKey:'exploreOuter'};D.resolveBossClue(D.CARD_BY_ID[489]);}else D.toggleBossInfo()}report.dataset.done='true';})();</script>
