<!doctype html><meta charset="utf-8"><pre id="report">Running</pre><iframe id="game" width="1200" height="850"></iframe><script>
(async()=>{const q=new URLSearchParams(location.search);game.width=q.get('w')||1200;game.height=q.get('h')||850;const results=[],check=(v,m)=>{if(!v)throw Error(m)},test=async(n,f)=>{try{await f();results.push([n,'PASS'])}catch(e){results.push([n,e.stack])}report.textContent=JSON.stringify(results,null,2)};
await new Promise(r=>{game.onload=r;game.src='../index.html?test122=1'});const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__,B=w.RPGBoss;d.querySelector('#netLocal').click();D.startGame(['warrior']);const s=D.getState(),p=D.currentPlayer();
await test('Boss button opens unknown card; second click closes',()=>{const btn=d.querySelector('[data-table-boss]');check(btn,'boss button');btn.click();check(!d.querySelector('#bossInfoOverlay').hidden,'not open');check(d.querySelector('.boss-unknown'),'no silhouette');check(d.querySelectorAll('.boss-info-stat b').length===4,'four stats');check([...d.querySelectorAll('.boss-info-stat b')].every(e=>e.textContent==='—'),'secret stat leaked');btn.click();check(d.querySelector('#bossInfoOverlay').hidden,'not toggled closed')});
await test('Back: exactly six locked rows',()=>{D.toggleBossInfo();d.querySelector('[data-boss-flip]').click();check(d.querySelectorAll('.boss-info-rows>div').length===6,'six rows');check([...d.querySelectorAll('.boss-info-rows dd')].every(e=>e.textContent==='—'),'secret leaked')});
await test('Reveal type only; art selected by boss key',()=>{p.masteryPoints=w.RPGProgression.threshold(2);D.syncBossClues();check(B.reveal(s,0),'reveal');D.updateUI();const vals=[...d.querySelectorAll('.boss-info-rows dd')].map(e=>e.textContent);check(vals[0]===s.boss.types.join(' + '));check(vals.slice(1).every(v=>v==='—'));d.querySelector('[data-boss-flip]').click();check(d.querySelector('.boss-info-art img').getAttribute('src')==='assets/bosses/boss_'+s.boss.key+'.webp')});
await test('Actual clue card reveals shared data and keeps exploration',()=>{p.masteryPoints=w.RPGProgression.threshold(4);D.syncBossClues();s.exploration={hero:p.id,hex:p.hex,deckKey:'exploreOuter'};D.resolveBossClue(D.CARD_BY_ID[491]);check(s.boss.found.length===2);check(s.exploration,'exploration lost');check(d.querySelector('#modalContent').textContent.includes('Продолжить исследование'));check(!s.decks.exploreHeart.draw.includes(492),'second copy retained')});
await test('Four clues unlock; save roundtrip preserves boss',()=>{p.masteryPoints=w.RPGProgression.threshold(15);for(let i=2;i<4;i++){D.syncBossClues();check(B.reveal(s,i))}D.updateUI();check(D.heartAccessAllowed());check(d.querySelector('#bossInfoOverlay').textContent.includes('Проход в Сердце тьмы открыт'));const saved=D.exportOnlineState();D.normalizeIncomingState(saved);check(JSON.stringify(saved.boss)===JSON.stringify(D.getState().boss),'boss changed')});
await test('Popup stays inside viewport and close controls reachable',()=>{const panel=d.querySelector('.boss-info-panel'),r=panel.getBoundingClientRect();check(r.top>=0&&r.bottom<=w.innerHeight+1,'vertical overflow');check(r.left>=0&&r.right<=w.innerWidth+1,'horizontal overflow');panel.scrollTop=panel.scrollHeight;const button=panel.querySelector('footer [data-boss-close]'),br=button.getBoundingClientRect();check(br.bottom<=w.innerHeight+1,'close outside');button.click();check(d.querySelector('#bossInfoOverlay').hidden)});
if(q.has('art'))await test('All 33 boss images load',async()=>{for(const v of B.variants)await new Promise((res,rej)=>{const img=new w.Image();img.onload=()=>{try{check(img.naturalWidth===img.naturalHeight,'not square '+v.key);res()}catch(e){rej(e)}};img.onerror=()=>rej(Error('missing '+v.key));img.src='../assets/bosses/boss_'+v.key+'.webp'})});
await test('Final boss uses party stats and victory completes game',()=>{D.startGame(['warrior']);const gs=D.getState(),hero=D.currentPlayer();hero.hex=w.MAP_DATA.bossHex;check(!D.startBossBattle(hero),'entered before four clues');gs.boss.found=[0,1,2,3];gs.boss.heartUnlocked=true;hero.masteryPoints=w.RPGProgression.threshold(30);check(D.startBossBattle(hero),'boss did not start');D.cancelCombatAuto();const c=gs.combat;check(c.enemyMaxHp===gs.boss.hp,'scaled fixed HP');check(c.enemyFields['Тип']===gs.boss.types.join(' + '),'wrong type');check(d.querySelector('.tabletop-battle-card.enemy img')?.getAttribute('src')==='assets/bosses/boss_'+gs.boss.key+'.webp','wrong combat art');c.pendingResolvedDamage={kind:'ability',hit:{rule:{},returnPhase:'hero_turn'},amount:c.enemyHp,reduction:0};D.commitEnemyDamage();check(c.phase==='victory'&&c.victory.boss,'not boss victory');check(gs.gameWon?.heroId===hero.id,'winner missing');D.finishCombatVictory();check(gs.gameOver?.winnerId===hero.id,'game not completed');check(!gs.combat,'combat retained')});
report.dataset.done='true';})();</script>
