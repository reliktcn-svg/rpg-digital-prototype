<!doctype html><meta charset="utf-8"><pre id="report">Running</pre><script>
(async()=>{let results=[];for(const [width,height] of [[1440,900],[1366,768],[1280,600],[1920,1080],[390,844]]){const f=document.createElement('iframe');f.style=`width:${width}px;height:${height}px;border:0`;document.body.append(f);await new Promise(r=>{f.onload=r;f.src='../index.html'});const d=f.contentDocument,w=f.contentWindow;d.querySelector('#onlineHome').hidden=true;d.querySelector('#onlineRoom').hidden=false;d.querySelector('#roomCode').textContent='123456';d.querySelector('#roomPlayers').innerHTML=Array.from({length:6},(_,i)=>`<div class="net-player"><b>Игрок ${i+1}</b><span>Герой</span></div>`).join('');d.querySelector('#netHeroPicker').innerHTML=Array.from({length:6},(_,i)=>`<button class="net-hero"><b>Герой ${i+1}</b><small>Свободен</small></button>`).join('');await new Promise(r=>requestAnimationFrame(r));const overlay=d.querySelector('#onlineLobby'),code=d.querySelector('#roomCode');overlay.scrollTop=0;const top=code.getBoundingClientRect();const card=d.querySelector('.online-lobby-card').getBoundingClientRect();overlay.scrollTop=overlay.scrollHeight;const end=d.querySelector('#netBack').getBoundingClientRect();results.push({width,height,codeVisible:top.top>=0&&top.bottom<=height,topReachable:card.top>=0,bottomReachable:end.top>=0&&end.bottom<=height,codeTop:top.top});f.remove();}report.textContent=JSON.stringify(results,null,2)})();
</script>
