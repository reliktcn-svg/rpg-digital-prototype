<!doctype html><meta charset="utf-8"><title>Atlas live loading regression</title><style>body{background:#14211f;color:#eee;font:14px system-ui}pre{white-space:pre-wrap}iframe{width:390px;height:844px}</style><h1>Atlas loading</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{const results=[],check=(v,m='Assertion')=>{if(!v)throw Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}await new Promise(r=>{game.onload=r;game.src='../index.html?atlas-tests'});const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__,P=w.RPGProgression,L=w.RPGAtlas;await L.ready;d.getElementById('netLocal').click();w.__RPG_ONLINE__.startWithHeroes(['paladin','warrior']);const html=await (await fetch('../'+encodeURIComponent('Атлас героев.html'),{cache:'no-store'})).text(),data=L.parse(html),originalFetch=w.fetch;
await test('Startup reads actual HTML on this host, with no API dependency',()=>{check(L.status.ok&&L.status.source==='html');check(P.hero('paladin').branches[0].nodes.every(n=>n.description.includes('половине')));check(P.rules(P.hero('warrior').nodes.find(n=>n.id==='n1_N10')).chance.sides===6);check(P.rules(P.hero('warrior').nodes.find(n=>n.id==='n1_N12')).chance.sides===4)});
await test('Changed description refreshes hero sheet, card and tree from one source',async()=>{const next=structuredClone(data);const hero=next.characters.find(h=>h.name==='Паладин');hero.abilities[0].nodes[0].description+=' ТЕСТ: текст из файла.';const updated=html.replace(/(<script[^>]*id="initial"[^>]*>)[\s\S]*?(<\/script>)/,(_,a,b)=>a+JSON.stringify(next)+b);w.fetch=async(url,options)=>String(url).includes(encodeURIComponent('Атлас героев.html'))||String(url).includes('Атлас')?new w.Response(updated,{status:200}):originalFetch(url,options);D.openCharacterSheet('overview',null,'paladin');await L.refresh();check(d.querySelector('.hero-ability-card').textContent.includes('ТЕСТ: текст из файла.'));check(D.heroCombatInfo(D.getPlayer('paladin')).effect.includes('ТЕСТ: текст из файла.'));D.openHeroProgression('paladin');await L.refresh();await wait(20);d.querySelector('[data-skill="n6_C8"]').click();check(d.querySelector('.skill-detail-dialog').textContent.includes('ТЕСТ: текст из файла.'));check(!d.querySelector('.skill-detail-dialog').textContent.includes('Один раз за бой'));w.RPGSkillTree.close();D.closeCharacterSheet();w.fetch=originalFetch;await L.refresh()});
await test('Bad/missing atlas displays error instead of silently showing stale copy',async()=>{const before=P.hero('paladin').nodes[0].description;w.fetch=async()=>new w.Response('missing',{status:404});const result=await L.refresh();check(!result.ok&&d.getElementById('atlasLoadNotice').textContent.includes('HTTP 404'));check(P.hero('paladin').nodes[0].description===before);w.fetch=originalFetch;await L.refresh();check(L.status.ok&&!d.getElementById('atlasLoadNotice'))});
await test('Invalid JSON preserves last valid project and reports the problem',async()=>{w.fetch=async()=>new w.Response('<script id="initial">{bad json</'+'script>');const r=await L.refresh();check(!r.ok&&d.getElementById('atlasLoadNotice'));check(P.hero('paladin'));w.fetch=originalFetch;await L.refresh()});
await test('Local-file bridge returns saved HTML, never a cached editor draft',async()=>{const parsed=new DOMParser().parseFromString(html,'text/html'),script=[...parsed.scripts].find(s=>s.textContent.includes('storageKey=')),match=script.textContent.match(/const storageKey=(.*?);let storageOK/);check(match);const path=new URL('../Атлас героев.html',location.href).pathname,initial=JSON.parse(parsed.getElementById('initial').textContent),hash=Array.from(JSON.stringify(initial)).reduce((h,c)=>(Math.imul(31,h)+c.charCodeAt(0))|0,0),key='rpg-atlas-v1:'+path+':'+hash;const cached=structuredClone(initial);cached.characters[0].abilities[0].nodes[0].description='STALE LOCAL DRAFT';localStorage.setItem(key,JSON.stringify(cached));const frame=document.createElement('iframe');frame.hidden=true;const token='regression-'+Date.now();const received=new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('No bridge response')),4000);function onMessage(e){if(e.source!==frame.contentWindow||e.data?.token!==token)return;clearTimeout(timer);removeEventListener('message',onMessage);resolve(e.data.project)}addEventListener('message',onMessage)});frame.src='../'+encodeURIComponent('Атлас героев.html')+'?rpg-atlas-read='+token;document.body.append(frame);try{const result=await received;check(result.characters[0].abilities[0].nodes[0].description===initial.characters[0].abilities[0].nodes[0].description)}finally{frame.remove();localStorage.removeItem(key)}});
await test('Descriptions are parsed inertly, without executing HTML scripts',()=>{w.atlasInjected=false;L.parse(html+'<script>window.atlasInjected=true</'+'script>');check(!w.atlasInjected)});
progress.textContent=results.every(r=>r.pass)?'PASS '+results.length:'FAIL';})().catch(e=>{progress.textContent='ERROR';report.textContent=e.stack});</script>
