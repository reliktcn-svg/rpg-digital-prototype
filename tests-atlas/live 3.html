<!doctype html><meta charset="utf-8"><title>Live atlas file replacement</title><style>body{margin:0;background:#14211f;color:white;font:14px system-ui}iframe{width:1280px;height:720px;border:0}pre{white-space:pre-wrap}</style><button id="refresh">Прочитать файл заново</button><pre id="report">Loading</pre><iframe id="game"></iframe><script>
let w;async function checkFile(){const status=await w.RPGAtlas.refresh(),P=w.RPGProgression,D=w.__RPG_DEBUG__,p=D.getPlayer('paladin');D.openCharacterSheet('overview',null,'paladin');report.textContent=JSON.stringify({status,description:D.heroCombatInfo(p).effect,visibleDescription:w.document.querySelector('.hero-ability-card').textContent,healingRatio:P.rules(P.selected(p,'ability')).healingRatio,naturalII:P.rules(P.hero('paladin').nodes.find(n=>n.id==='n6_N10')).chance,naturalIII:P.rules(P.hero('paladin').nodes.find(n=>n.id==='n6_N12')).chance},null,2)}refresh.onclick=checkFile;game.onload=async()=>{w=game.contentWindow;await w.RPGAtlas.ready;w.document.getElementById('netLocal').click();w.__RPG_ONLINE__.startWithHeroes(['paladin','warrior']);await checkFile()};game.src='../index.html?live-atlas';
</script>
