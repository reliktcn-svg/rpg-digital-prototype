<!doctype html><meta charset="utf-8"><title>Personal dice regression</title><style>body{font:14px system-ui;background:#18201c;color:white}pre{white-space:pre-wrap}iframe{width:390px;height:844px}</style><h1>Personal dice regression</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="game"></iframe><script>
(async()=>{
 const results=[],f=document.getElementById('game'),wait=ms=>new Promise(r=>setTimeout(r,ms));
 const check=(v,m)=>{if(!v)throw Error(m||'Assertion')};
 async function test(name,fn){progress.textContent=name;try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
 let w,d,D,S,instances=[];
 async function fresh(){await new Promise(r=>{f.onload=r;f.src='../index.html?personal='+Date.now()});w=f.contentWindow;d=w.document;D=w.__RPG_DEBUG__;S=w.RPGDiceSettings;d.getElementById('netLocal').click();w.__RPG_ONLINE__.startWithHeroes(['warrior','mage']);const state=D.getState();state.order=['warrior','mage'];state.currentIndex=0;D.updateUI();for(const id of ['warrior','mage'])S.set({skin:'classic',speed:1,motion:'bounce',colors:{rim:'#D4AF37',face:'#60646C',number:'#FFFFFF'}},id);const base=w.FantasyDice;instances=[];w.FantasyDice={...base,create(opts){const api=base.create(opts);instances.push({api,container:opts.container});return api}};}
 const info=()=>instances.find(x=>x.container.id==='rollPopupArcana')?.api;
 const battle=()=>instances.find(x=>x.container.classList.contains('arcana-combat-dice'))?.api;
 const turn=id=>{D.getState().currentIndex=D.getState().order.indexOf(id);D.updateUI();};
 const open=()=>{d.getElementById('journalBtn').click();d.getElementById('journalDiceBtn').click();};
 const close=()=>d.querySelector('.dice-settings [data-close]').click();
 const change=(id,value)=>{const el=d.getElementById(id);el.value=value;el.dispatchEvent(new w.Event('change'));};
 await fresh();
 await test('Warrior and mage keep separate speed, motion and colors',async()=>{S.set({skin:'custom',speed:4,motion:'roll',colors:{rim:'#D4AF37',face:'#D62828',number:'#141414'}},'warrior');S.set({skin:'custom',speed:2,colors:{rim:'#C0C0C0',face:'#2454C6',number:'#FFFFFF'}},'mage');check(S.get('warrior').speed===4&&S.get('mage').speed===2);check(S.resolveSkin(S.get('warrior'))!==S.resolveSkin(S.get('mage')));const copy=S.get('warrior');copy.colors.face='#FFFFFF';check(S.get('warrior').colors.face==='#D62828');check(S.get(null).skin==='classic'&&S.get(null).speed===1);});
 await test('Online journal edits local hero during another hero turn',async()=>{turn('mage');w.__RPG_ONLINE__.setLocalHeroId('warrior');open();check(d.getElementById('diceSettingsOwner').textContent==='Воин');change('diceSpeed','4');check(S.get('mage').speed===2);close();w.__RPG_ONLINE__.setLocalHeroId(null);});
 await test('Each part offers 15 colors; three changes do not mutate game state',async()=>{turn('warrior');open();const before=JSON.stringify(w.__RPG_ONLINE__.exportState());for(const [part,color] of [['rim','#C0C0C0'],['face','#00896B'],['number','#FFFFFF']]){d.querySelector('[data-part='+part+']').click();check(d.querySelectorAll('.dice-swatches button').length===15);d.querySelector('[data-color="'+color+'"]').click();check(S.get('warrior').colors[part]===color)}check(S.get('warrior').skin==='custom');check(JSON.stringify(w.__RPG_ONLINE__.exportState())===before);const material=w.FantasyDiceSkins.get(S.resolveSkin(S.get('warrior')));check(material.number==='#FFFFFF'&&material.rim[2]==='#C0C0C0'&&material.face.join(',')==='0,137,107');close();});
 await test('Changing only the rim preserves background and numeral colors',async()=>{turn('warrior');S.set({skin:'satin-red'},'warrior');const old=w.FantasyDiceSkins.get('satin-red');open();d.querySelector('[data-part=rim]').click();d.querySelector('[data-color="#D4AF37"]').click();const now=w.FantasyDiceSkins.get(S.resolveSkin(S.get('warrior')));check(now.face.join(',')===old.face.join(',')&&now.number.toLowerCase()===old.number.toLowerCase());close();});
 await test('An open menu stays attached to its hero when the turn changes',async()=>{turn('warrior');open();turn('mage');change('diceSpeed','1');check(S.get('warrior').speed===1&&S.get('mage').speed===2);check(d.getElementById('diceSettingsOwner').textContent==='Воин');close();open();check(d.getElementById('diceSettingsOwner').textContent==='Маг');close();});
 await test('Profiles survive reload independently',async()=>{const expected=JSON.stringify([S.get('warrior'),S.get('mage')]);await new Promise(r=>{f.onload=r;f.src='../index.html?reload='+Date.now()});w=f.contentWindow;S=w.RPGDiceSettings;check(JSON.stringify([S.get('warrior'),S.get('mage')])===expected);});
 await fresh();
 await test('Movement rolls use acting hero, not online viewer',async()=>{S.set({skin:'satin-red',speed:4},'warrior');S.set({skin:'worn-crimson',speed:2},'mage');w.__RPG_ONLINE__.setLocalHeroId('mage');turn('warrior');D.showRollPopup('Движение · D6',3,'D6 = 3');check(info().getState().skin==='satin-red'&&info().getState().speed===4);info().skip();await wait(0);d.getElementById('rollPopupClose').click();turn('mage');D.showRollPopup('Движение · D6',4,'D6 = 4');check(info().getState().skin==='worn-crimson'&&info().getState().speed===2);info().skip();await wait(0);d.getElementById('rollPopupClose').click();w.__RPG_ONLINE__.setLocalHeroId(null);});
 await test('Queued rolls retain original owner and material snapshot',async()=>{turn('warrior');S.set({skin:'custom',speed:4,colors:{face:'#D62828'}},'warrior');D.showRollPopup('Первый',3,'D6 = 3');const before=info().getState();D.showRollPopup('Очередь',4,'D6 = 4');turn('mage');S.set({speed:1,colors:{face:'#2454C6'}},'warrior');const newer=S.resolveSkin(S.get('warrior'));check(info().getState().skin===before.skin&&newer!==before.skin);info().skip();await wait(0);d.getElementById('rollPopupClose').click();check(info().getState().skin===before.skin&&info().getState().speed===4);info().skip();await wait(0);d.getElementById('rollPopupClose').click();});
 await fresh();
 await test('Off-turn shrine healing uses the visiting hero',async()=>{S.set({skin:'satin-red',speed:4},'warrior');S.set({skin:'worn-crimson',speed:2},'mage');const hero=D.getPlayer('warrior');hero.currentHp=1;turn('mage');D.visitShrine(hero,{mode:'cursed',natural:null,title:'Святилище'},()=>{});check(info().getState().skin==='satin-red'&&info().getState().speed===4);info().skip();await wait(0);d.getElementById('rollPopupClose').click();});
 await fresh();
 await test('Combat hero has personal dice; enemy dice stay neutral',async()=>{S.set({skin:'satin-red',speed:4},'warrior');D.combatStart(D.CARD_BY_ID[24]);D.combatFight();D.combatHeroAttack();check(battle().getState().skin==='satin-red'&&battle().getState().speed===4);check(D.getState().combat.lastRoll.diceHeroId==='warrior');battle().skip();D.getState().combat.phase='enemy_ready';D.combatEnemyTurn();check(battle().getState().skin==='classic'&&battle().getState().speed===1);check(D.getState().combat.lastRoll.diceHeroId===null);});
 await test('A second tab cannot overwrite another hero profile',async()=>{const other=document.createElement('iframe');document.body.append(other);await new Promise(r=>{other.onload=r;other.src='../index.html?second-profile'});const second=other.contentWindow.RPGDiceSettings;second.set({speed:2,skin:'worn-crimson'},'mage');S.set({speed:4,skin:'satin-red'},'warrior');const stored=JSON.parse(w.localStorage.getItem('rpg-dice-preferences-v2'));check(stored.mage.speed===2&&stored.mage.skin==='worn-crimson'&&stored.warrior.speed===4);other.remove();});
 progress.textContent='DONE '+results.filter(x=>x.pass).length+'/'+results.length;report.textContent=JSON.stringify({finished:true,results},null,2);
})();</script>
