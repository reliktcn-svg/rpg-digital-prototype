<!doctype html><meta charset="utf-8"><title>Dice regression</title><style>body{font:14px system-ui;background:#18201c;color:#eee}#host{width:390px}pre{white-space:pre-wrap}</style><h1>Dice regression</h1><p id="progress">Running</p><pre id="report"></pre><div id="host"></div><iframe id="game" style="width:390px;height:844px"></iframe><script src="../arcana/dice-motion.js"></script><script src="../arcana/dice-skins.js"></script><script src="../arcana/dice-renderer.js"></script><script src="../arcana/dice-animator.js"></script><script>
(async()=>{const results=[],host=document.getElementById('host'),check=(v,m)=>{if(!v)throw Error(m||'Assertion')},wait=ms=>new Promise(r=>setTimeout(r,ms));let api;const fresh=opts=>{api?.destroy();api=FantasyDice.create({container:host,duration:180,staggerMs:30,reducedMotion:'never',...opts});return api};const roll={id:'fixed',dice:[{sides:20,value:17}],total:21};async function test(name,fn){progress.textContent=name;try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.message})}report.textContent=JSON.stringify(results,null,2)}
for(const sides of [4,6,8,10,12,20])await test('D'+sides+' keeps result and ends as canvas',async()=>{fresh();const payload={dice:[{sides,value:sides}]},before=JSON.stringify(payload);const r=await api.play(payload);check(r.mode==='canvas');check(r.roll.dice[0].value===sides);check(JSON.stringify(payload)===before);check(api.getState().status==='settled')});
await test('Skin switch during animation neither restarts nor mutates roll',async()=>{fresh({duration:400});let starts=0;const listener=()=>starts++;host.addEventListener('dice:start',listener);const p=api.play(roll);await wait(80);const before=api.getState().roll;api.setSkin('worn-crimson');check(api.getState().status==='playing');check(api.getState().roll===before);check(api.getState().skin==='worn-crimson');check((await p).roll.total===21);check(starts===1);host.removeEventListener('dice:start',listener)});
await test('All palette skins keep final results',async()=>{fresh();for(const skin of FantasyDiceSkins.list()){api.setSkin(skin);check((await api.play(roll,{duration:0})).roll.dice[0].value===17)}});
await test('Real bitmap texture loads and uses same animation',async()=>{const canvas=document.createElement('canvas');canvas.width=16;canvas.height=16;const c=canvas.getContext('2d');c.fillStyle='#84212a';c.fillRect(0,0,16,16);c.fillStyle='#ad4a4f';c.fillRect(2,2,3,3);await FantasyDiceSkins.load('bitmap',{textureUrl:canvas.toDataURL()});fresh({skin:'bitmap'});check((await api.play(roll)).mode==='canvas')});
await test('Invalid skin leaves active skin intact',async()=>{fresh();try{api.setSkin('missing');throw Error('accepted')}catch(e){check(e instanceof RangeError)}check(api.getState().skin==='classic')});
await test('Skin changes do not alter poses',async()=>{const frame=FantasyDiceMotion.sample(.37,{x:195,y:90,size:64,cellW:390}),snapshot=JSON.stringify(frame),c=document.createElement('canvas');c.width=390;c.height=240;for(const id of FantasyDiceSkins.list()){FantasyDiceRenderer.render(c.getContext('2d'),390,240,[{sides:20,value:17,...frame}],{skin:FantasyDiceSkins.get(id)});check(JSON.stringify(frame)===snapshot)}});
await test('Skip resolves exactly once with supplied result',async()=>{fresh({duration:1000});const p=api.play(roll);api.skip();api.skip();const r=await p;check(r.status==='skipped'&&r.roll.dice[0].value===17)});
await test('Replacement settles both requests',async()=>{fresh();const a=api.play(roll);const b=api.play({dice:[{sides:6,value:2}]});check((await a).status==='replaced');check((await b).roll.dice[0].value===2)});
await test('Destroy settles active request and removes host',async()=>{fresh();const p=api.play(roll);api.destroy();check((await p).status==='destroyed');check(!host.children.length)});
await test('Reduced motion reveals authoritative result immediately',async()=>{fresh({reducedMotion:'always'});check((await api.play(roll)).status==='completed');check(api.getState().status==='settled')});
await test('Speed and multiple staggered dice keep order',async()=>{fresh();api.setSpeed(2);const dice=[{sides:6,value:3},{sides:20,value:1},{sides:8,value:7}];check(JSON.stringify((await api.play({dice})).roll.dice)===JSON.stringify(dice))});
await test('All 24 dice supported on small viewport',async()=>{fresh();const dice=Array.from({length:24},(_,i)=>({sides:20,value:i%20+1}));const r=await api.play({dice},{duration:0});check(r.mode==='canvas'&&r.roll.dice.length===24)});
await test('Renderer failure keeps textual result',async()=>{fresh();const original=FantasyDiceRenderer.render;FantasyDiceRenderer.render=()=>{throw Error('test graphics failure')};try{const r=await api.play(roll);check(r.mode==='text'&&r.roll.dice[0].value===17)}finally{FantasyDiceRenderer.render=original}});
await test('Invalid dice do not interrupt valid animation',async()=>{fresh();const p=api.play(roll);try{api.play({dice:[{sides:20,value:21}]});throw Error('accepted')}catch(e){check(e instanceof TypeError)}check((await p).roll.dice[0].value===17)});
await test('Game movement popup uses new modules',async()=>{const f=document.getElementById('game');await new Promise(r=>{f.onload=r;f.src='../index.html'});const w=f.contentWindow,d=w.document;d.getElementById('netLocal').click();d.getElementById('startBtn').click();const D=w.__RPG_DEBUG__,p=D.currentPlayer();D.showRollPopup('Проверка D20',17,'D20 = 17','',null,null,'Продолжить',true);await wait(50);check(d.querySelector('[data-fantasy-dice]'));check(w.FantasyDiceMotion&&w.FantasyDiceSkins);await wait(2450);check(d.querySelector('[data-fantasy-dice]').shadowRoot.textContent.includes('17'));});
await test('Combat overlay preserves dice and uses rolling renderer',async()=>{const w=document.getElementById('game').contentWindow,d=w.document,D=w.__RPG_DEBUG__;d.getElementById('rollPopupClose')?.click();D.combatStart(D.CARD_BY_ID[24]);D.combatFight();D.combatHeroAttack();await wait(60);const c=D.getState().combat,expected=JSON.stringify(c.lastRoll.dice),host=d.querySelector('.arcana-combat-dice [data-fantasy-dice]');check(host,'Combat renderer missing');await wait(2450);check(JSON.stringify(c.lastRoll.dice)===expected,'Animation changed result');check(host.shadowRoot.querySelector('canvas').width>0);});
await test('Journal dice menu saves preferences without changing game state',async()=>{const f=document.getElementById('game');await new Promise(r=>{f.onload=r;f.src='../index.html?settings-test'});const w=f.contentWindow,d=w.document;d.getElementById('netLocal').click();d.getElementById('startBtn').click();const before=JSON.stringify(w.__RPG_ONLINE__.exportState());d.getElementById('journalBtn').click();d.getElementById('journalDiceBtn').click();check(d.querySelector('.dice-settings').open);for(const [id,value] of [['diceSkin','worn-crimson'],['diceSpeed','2'],['diceMotion','roll']]){const e=d.getElementById(id);e.value=value;e.dispatchEvent(new w.Event('change'));}check(w.RPGDiceSettings.get().speed===2&&w.RPGDiceSettings.get().skin==='worn-crimson'&&w.RPGDiceSettings.get().motion==='roll');check(JSON.parse(w.localStorage.getItem('rpg-dice-preferences-v2'))[w.__RPG_DEBUG__.currentPlayer().id].speed===2);check(JSON.stringify(w.__RPG_ONLINE__.exportState())===before);d.querySelector('.dice-settings [data-close]').click();check(!d.querySelector('.dice-settings').open);d.getElementById('journalDiceBtn').click();check(d.getElementById('diceSkin').value==='worn-crimson'&&d.getElementById('diceSpeed').value==='2');d.querySelector('.dice-settings [data-close]').click();w.RPGDiceSettings.set({skin:'classic',speed:1,motion:'bounce'});});
await test('Game popup takes saved skin, speed and animation',async()=>{const w=document.getElementById('game').contentWindow,d=w.document;w.RPGDiceSettings.set({skin:'satin-red',speed:2,motion:'roll'});const base=w.FantasyDice;let instance;w.FantasyDice={...base,create(options){instance=base.create(options);return instance}};w.__RPG_DEBUG__.showRollPopup('D20',17,'D20 = 17');await wait(50);check(instance.getState().skin==='satin-red'&&instance.getState().speed===2&&instance.getState().motion==='roll');check(instance.getState().status==='playing');await wait(1250);check(instance.getState().status==='settled');w.FantasyDice=base;w.RPGDiceSettings.set({skin:'classic',speed:1,motion:'bounce'});});
await test('Fast ×4 combat roll finishes before game auto-transition',async()=>{const f=document.getElementById('game');await new Promise(r=>{f.onload=r;f.src='../index.html?slow-test'});const w=f.contentWindow,d=w.document;d.getElementById('netLocal').click();d.getElementById('startBtn').click();w.RPGDiceSettings.set({speed:4,skin:'classic',motion:'bounce'});const base=w.FantasyDice;let instance;w.FantasyDice={...base,create(options){instance=base.create(options);return instance}};const D=w.__RPG_DEBUG__;D.combatStart(D.CARD_BY_ID[24]);D.combatFight();D.combatHeroAttack();const phase=D.getState().combat.phase;await wait(250);check(instance.getState().status==='playing','Animation ended too early');check(D.getState().combat.phase===phase,'Game advanced before animation');await wait(500);check(instance.getState().status==='settled');w.RPGDiceSettings.set({speed:1,skin:'classic',motion:'bounce'});});
api?.destroy();progress.textContent='DONE '+results.filter(x=>x.pass).length+'/'+results.length;report.textContent=JSON.stringify({finished:true,results},null,2);
})();
</script>
