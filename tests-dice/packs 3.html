<!doctype html><html lang="ru"><meta charset="utf-8"><title>Dice collection checks</title><style>body{font:14px system-ui;background:#18211e;color:#eee}pre{white-space:pre-wrap}canvas{background:#10191c;max-width:100%}iframe{width:390px;height:844px}</style><h1>Dice collection checks</h1><p id="progress">Running</p><pre id="report"></pre><canvas id="sample" width="960" height="540"></canvas><iframe id="game"></iframe><script>
(async()=>{
const results=[],frame=document.getElementById('game'),check=(x,m)=>{if(!x)throw Error(m||'Assertion')};
await new Promise(r=>{frame.onload=r;frame.src='../index.html?collection='+Date.now()});const w=frame.contentWindow,d=w.document,P=w.FantasyDicePacks,S=w.RPGDiceSettings,R=w.FantasyDiceRenderer;
d.getElementById('netLocal').click();w.__RPG_ONLINE__.startWithHeroes(['warrior','mage']);w.__RPG_DEBUG__.getState().order=['warrior','mage'];w.__RPG_DEBUG__.getState().currentIndex=0;S.set({pack:null},'warrior');S.set({pack:null},'mage');
const originalFetch=w.fetch.bind(w),path='assets/dice/packs/studio-sample/pack.json',second='assets/dice/packs/second-sample/pack.json';
const manifest=await (await originalFetch('../'+path)).json();
async function mockRefresh(paths,manifests={}){
 w.fetch=(url,opts)=>{const p=new URL(url,w.location.href).pathname.slice(1);if(p==='api/dice-packs')return Promise.resolve(new w.Response(JSON.stringify({format:'rpg-dice-catalog-v1',packs:paths}),{status:200}));if(manifests[p])return Promise.resolve(new w.Response(JSON.stringify(manifests[p]),{status:200}));if(p.startsWith('assets/dice/packs/second-sample/'))return originalFetch('/'+p.replace('/second-sample/','/studio-sample/'),opts);return originalFetch(url,opts);};
 try{return await P.refresh()}finally{w.fetch=originalFetch}
}
async function test(name,fn){progress.textContent=name;try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
const menu=()=>d.getElementById('diceSkin'),close=()=>d.querySelector('.dice-settings [data-close]').click();
await test('Server discovers a folder and loads all six die shapes',async()=>{await P.refresh();check(!P.error,P.error);check(P.list().length>=1);check(Object.keys(P.get('studio-sample').faces).length===6);for(const layers of Object.values(P.get('studio-sample').faces))check(layers.face.naturalWidth===1024&&layers.rim.naturalHeight===1024);});
await test('Appearance menu retains builtins and stores pack per hero',async()=>{d.getElementById('journalBtn').click();d.getElementById('journalDiceBtn').click();await P.refresh();for(const id of ['classic','custom','satin-red','worn-crimson','pack:studio-sample'])check([...menu().options].some(o=>o.value===id),id);check(!d.getElementById('dicePack'));menu().value='pack:studio-sample';menu().dispatchEvent(new w.Event('change'));check(S.get('warrior').pack==='studio-sample');check(S.get('mage').pack===null);close();});
await test('Two independent packs appear together without replacing old ones',async()=>{d.getElementById('journalDiceBtn').click();await P.refresh();await mockRefresh([path,second],{[second]:{...manifest,id:'second-sample',name:'Второе оформление'}});check(P.list().length===2&&!P.error);check([...menu().options].some(o=>o.value==='pack:second-sample'));check(menu().value==='pack:studio-sample');menu().value='pack:second-sample';menu().dispatchEvent(new w.Event('change'));check(S.get('warrior').pack==='second-sample',JSON.stringify({warrior:S.get('warrior'),mage:S.get('mage'),owner:d.getElementById('diceSettingsOwner').textContent,status:d.getElementById('diceSettingsSaved').textContent,open:d.querySelector('.dice-settings').open,debugOwner:d.querySelector('.dice-settings').dataset.debugOwner,scriptCount:[...d.scripts].map(s=>s.src).filter(s=>s.includes('dice-settings')),choice:menu().value}));close();});
await test('Rename changes label, keeps ID, colors, speed and material revision',async()=>{d.getElementById('journalDiceBtn').click();await P.refresh();S.set({pack:'studio-sample',speed:2},'warrior');close();d.getElementById('journalDiceBtn').click();await P.refresh();const before=JSON.stringify(S.get('warrior')),revision=P.get('studio-sample').revision;await mockRefresh([path],{[path]:{...manifest,name:'Рубиновая сталь'}});check(P.get('studio-sample').name==='Рубиновая сталь');check(menu().selectedOptions[0].textContent==='Рубиновая сталь');check(JSON.stringify(S.get('warrior'))===before);check(P.get('studio-sample').revision===revision);close();});
await test('Color and speed edits keep selected external pack',async()=>{d.getElementById('journalDiceBtn').click();await P.refresh();d.querySelector('[data-part=face]').click();d.querySelector('[data-color="#D62828"]').click();const speed=d.getElementById('diceSpeed');speed.value='4';speed.dispatchEvent(new w.Event('change'));check(S.get('warrior').pack==='studio-sample'&&S.get('warrior').speed===4,JSON.stringify({warrior:S.get('warrior'),status:d.getElementById('diceSettingsSaved').textContent}));check(menu().value==='pack:studio-sample');close();});
await test('Returning to builtin clears only external selection',async()=>{d.getElementById('journalDiceBtn').click();await P.refresh();menu().value='classic';menu().dispatchEvent(new w.Event('change'));check(!S.get('warrior').pack&&S.get('warrior').speed===4);close();});
await test('Pack renders all shapes with colors and preserved results',async()=>{await P.refresh();S.set({skin:'custom',pack:'studio-sample',colors:{rim:'#C0C0C0',face:'#D62828',number:'#FFFFFF'}},'warrior');const skin=w.FantasyDiceSkins.get(S.resolveSkin(S.get('warrior')));check(!!skin.surfacePack);const canvas=document.getElementById('sample'),ctx=canvas.getContext('2d');const items=[4,6,8,10,12,20].map((sides,i)=>({sides,value:sides,x:160+(i%3)*320,y:125+Math.floor(i/3)*260,size:90}));const snapshot=JSON.stringify(items);R.render(ctx,960,540,items,{skin});check(snapshot===JSON.stringify(items));check(ctx.getImageData(0,0,960,540).data.some((v,i)=>i%4===3&&v>0));for(const sides of R.supportedDice)for(let value=1;value<=sides;value++)check(R.inspect(sides,value).frontFace===value);});
await test('Broken new pack does not hide valid existing pack',async()=>{await mockRefresh([path,second],{[second]:{...manifest,id:'second-sample',faces:{'20':{face:'missing.png'}}}});check(!!P.error);check(P.list().length===1&&!!P.get('studio-sample'));});
await test('Broken update retains previous working material',async()=>{const before=P.get('studio-sample');await mockRefresh([path],{[path]:{...manifest,faces:{'20':{face:'missing.png'}}}});check(!!P.error&&P.get('studio-sample')===before);});
await test('Traversal is rejected without replacing working pack',async()=>{const before=P.get('studio-sample');await mockRefresh([path],{[path]:{...manifest,faces:{'20':{face:'../../missing.png'}}}});check(P.error.includes('имя файла'));check(P.get('studio-sample')===before);});
await test('Duplicate persistent IDs rejected, no silent overwrite',async()=>{await mockRefresh([path,second],{[second]:manifest});check(P.error.includes('Повторяется ID'));check(P.list().length===0);});
await test('Removal keeps preference and restoration reactivates same ID',async()=>{await mockRefresh([]);check(P.list().length===0);check(S.get('warrior').pack==='studio-sample');check(!w.FantasyDiceSkins.get(S.resolveSkin(S.get('warrior'))).surfacePack);await P.refresh();check(!P.error&&w.FantasyDiceSkins.get(S.resolveSkin(S.get('warrior'))).surfacePack);});
await test('Legacy single-pack preference migrates to stable collection ID',async()=>{S.set({pack:'custom'},'mage');check(S.get('mage').pack==='studio-sample');S.set({pack:null},'mage');});
await test('Selected collection pack preserves authoritative roll result',async()=>{await P.refresh();const host=d.createElement('div');d.body.append(host);const api=w.FantasyDice.create({container:host,duration:20,skin:S.resolveSkin(S.get('warrior'))});check((await api.play({dice:[{sides:20,value:17}]})).roll.dice[0].value===17);api.destroy();});
progress.textContent='DONE '+results.filter(x=>x.pass).length+'/'+results.length;report.textContent=JSON.stringify({finished:true,results},null,2);
})();</script></html>
