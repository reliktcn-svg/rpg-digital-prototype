<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Катящийся кубик · v0.6.93</title><style>body{margin:0;background:#111719;color:#ece7d9;font:14px system-ui}main{max-width:780px;margin:auto;padding:20px}h1{font:26px Georgia}p{color:#bfc7c3;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button,select{min-height:40px;background:#273432;color:#f1e5cb;border:1px solid #6b735f;border-radius:7px;padding:8px 12px}#status{font-size:13px}#scrub{width:100%}label{display:block;margin:12px 0}#still{width:100%;height:240px;background:#10191c;border-radius:12px}details{margin-top:20px}a{color:#d9c18e}</style><main><h1>Бросок по поверхности</h1><p>Движение слева направо. X — 3¼ оборота по часовой стрелке; Y — 1¾ оборота против часовой. Плавная остановка. Скин можно менять даже во время броска.</p><nav><select id="sides" aria-label="Кубик"><option>20</option><option>12</option><option>10</option><option>8</option><option>6</option><option>4</option></select><select id="skin" aria-label="Скин"><option value="classic">Классический</option><option value="satin-red">Сталь / красный</option><option value="worn-crimson">Чёрный / бордовый</option></select><button id="roll">Повторить бросок</button><button id="pair">Два D20</button><button id="all">Все формы</button></nav><div id="dice"></div><p id="status" role="status"></p><details><summary>Рассмотреть движение по кадрам</summary><label>Ход броска <input id="scrub" type="range" min="0" max="1000" value="0"></label><canvas id="still"></canvas><p>Смена скина сохраняет положение, поворот и результат.</p></details><p><a href="../index.html">Открыть игру</a></p></main><script src="../arcana/dice-motion.js"></script><script src="../arcana/dice-skins.js"></script><script src="../arcana/dice-renderer.js"></script><script src="../arcana/dice-animator.js"></script><script>
const d=FantasyDice.create({container:document.getElementById('dice'),duration:2400,staggerMs:500});
const status=document.getElementById('status'),skin=document.getElementById('skin'),sides=document.getElementById('sides');
function play(dice){return d.play({label:'Бросок кубика',dice}).then(r=>status.textContent='Результат: '+r.roll.dice.map(x=>'D'+x.sides+' = '+x.value).join(' · '))}
function again(){const n=Number(sides.value);play([{sides:n,value:n}])}
document.getElementById('roll').onclick=again;sides.onchange=()=>{again();still()};document.getElementById('pair').onclick=()=>play([{sides:20,value:20},{sides:20,value:7}]);document.getElementById('all').onclick=()=>play([4,6,8,10,12,20].map(sides=>({sides,value:sides})));
skin.onchange=()=>{d.setSkin(skin.value);still()};
function still(){const c=document.getElementById('still'),w=c.clientWidth||600;c.width=w*2;c.height=480;const ctx=c.getContext('2d');ctx.scale(2,2);const pose=FantasyDiceMotion.sample(Number(document.getElementById('scrub').value)/1000,{x:w/2,y:105,size:64,cellW:w});FantasyDiceRenderer.render(ctx,w,240,[{sides:Number(sides.value),value:Number(sides.value),...pose}],{skin:FantasyDiceSkins.get(skin.value)});}
document.getElementById('scrub').oninput=still;document.querySelector('details').ontoggle=still;window.addEventListener('resize',still);again();
</script></html>
