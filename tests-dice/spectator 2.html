<!doctype html><html lang="ru"><meta charset="utf-8"><title>Spectator dice regression</title><style>body{background:#18211e;color:#eee;font:14px system-ui}pre{white-space:pre-wrap}iframe{width:390px;height:650px}</style><h1>Spectator dice regression</h1><p id="progress">Running</p><pre id="report"></pre><iframe id="owner"></iframe><iframe id="viewer"></iframe><script>
(async()=>{
const results=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),clone=x=>JSON.parse(JSON.stringify(x)),check=(v,m='Assertion')=>{if(!v)throw Error(m)};
async function test(name,fn){progress.textContent=name;try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.stack})}report.textContent=JSON.stringify(results,null,2)}
async function load(id){const f=document.getElementById(id);await new Promise(r=>{f.onload=r;f.src='../index.html?spectator='+id+Date.now()});return f.contentWindow}
const a=await load('owner'),b=await load('viewer'),A=a.__RPG_ONLINE__,B=b.__RPG_ONLINE__,D=a.__RPG_DEBUG__,S=a.RPGDiceSettings;
a.document.getElementById('netLocal').click();b.document.getElementById('netLocal').click();A.startWithHeroes(['warrior','mage']);D.getState().order=['warrior','mage'];D.getState().currentIndex=0;D.updateUI();A.setLocalHeroId('warrior');B.setLocalHeroId('mage');
await Promise.all([a.FantasyDicePacks.refresh(),b.FantasyDicePacks.refresh()]);
// Independent device profiles: viewer deliberately has no warrior customization.
const viewerSettings=b.RPGDiceSettings,ownViewer={skin:'worn-crimson',pack:null,speed:2,motion:'bounce',colors:{rim:'#141414',face:'#2454C6',number:'#FFFFFF'}};
b.RPGDiceSettings={...viewerSettings,get:id=>clone(id==='mage'?ownViewer:{skin:'classic',pack:null,speed:1,motion:'bounce',colors:{rim:'#D4AF37',face:'#60646C',number:'#FFFFFF'}})};
const instances=[];let plays=0;const dice=b.FantasyDice;b.FantasyDice={...dice,create(opts){const api=dice.create(opts);if(opts.container.classList.contains('arcana-combat-dice')){instances.push(api);return {...api,play(payload){plays++;return api.play(payload)}}}return api}};
const anim=()=>instances.at(-1),material=()=>b.FantasyDiceSkins.get(anim().getState().skin);
S.set({skin:'custom',pack:'studio-sample',speed:4,motion:'roll',colors:{rim:'#C0C0C0',face:'#D62828',number:'#141414'}},'warrior');
D.combatStart(D.CARD_BY_ID[24]);D.combatFight();D.combatHeroAttack();let first=clone(A.exportState());A.setLocalHeroId('mage');D.renderCombat();
let room,host,guest,revision=0;
const credentials=x=>({playerId:x.playerId,playerSecret:x.playerSecret});
async function api(path,body){const res=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await res.json();check(res.ok,data.error||String(res.status));return data}
async function pull(){const auth=new URLSearchParams(credentials(guest));return (await api('/api/rooms/'+room+'/game?'+auth)).state}
async function push(state){const response=await api('/api/rooms/'+room+'/game/state',{...credentials(host),baseRevision:revision,state});revision=response.revision;return pull()}
await test('Combat roll captures serializable actor colors, texture and speed',async()=>{const p=first.combat.lastRoll.dicePreferences;check(first.combat.lastRoll.diceHeroId==='warrior');check(p.skin==='custom'&&p.pack==='studio-sample'&&p.colors.face==='#D62828'&&p.speed===4&&p.motion==='roll');check(JSON.stringify(p)===JSON.stringify(S.get('warrior')));});
await test('Server round trip gives observer actor texture despite different local defaults',async()=>{
 host=await api('/api/rooms',{name:'Dice test owner'});room=host.room.code;guest=await api('/api/rooms/'+room+'/join',{name:'Dice test observer'});
 await api('/api/rooms/'+room+'/select',{...credentials(host),heroId:'warrior'});await api('/api/rooms/'+room+'/select',{...credentials(guest),heroId:'mage'});await api('/api/rooms/'+room+'/start',credentials(host));
 revision=(await api('/api/rooms/'+room+'/game/init',{...credentials(host),state:first})).revision;
 const remote=await pull();check(JSON.stringify(remote.combat.lastRoll.dicePreferences)===JSON.stringify(first.combat.lastRoll.dicePreferences));
 const stored=b.localStorage.getItem('rpg-dice-preferences-v2'),mine=JSON.stringify(b.RPGDiceSettings.get('mage'));B.applyState(remote);
 check(material().surfacePack?.id==='studio-sample');check(material().face.join(',')==='214,40,40'&&material().rim[2]==='#C0C0C0'&&material().number==='#141414');check(anim().getState().speed===4&&anim().getState().motion==='roll');check(JSON.stringify(anim().getState().roll.dice)===JSON.stringify(first.combat.lastRoll.dice));check(b.localStorage.getItem('rpg-dice-preferences-v2')===stored&&JSON.stringify(b.RPGDiceSettings.get('mage'))===mine);
});
await test('Repeated network state does not restart roll or overwrite viewer preferences',async()=>{const count=plays;B.applyState(await pull());check(plays===count);check(b.RPGDiceSettings.get('warrior').skin==='classic'&&b.RPGDiceSettings.get('mage').skin==='worn-crimson');});
await test('Changing owner settings does not alter an existing roll snapshot',async()=>{const before=JSON.stringify(first.combat.lastRoll.dicePreferences);S.set({skin:'worn-crimson',pack:null,speed:2,motion:'bounce'},'warrior');check(JSON.stringify(D.getState().combat.lastRoll.dicePreferences)===before);B.applyState(await push(A.exportState()));check(material().surfacePack?.id==='studio-sample'&&anim().getState().speed===4);});
await test('Next roll transmits new owner appearance',async()=>{A.setLocalHeroId('warrior');D.getState().combat.phase='hero_turn';D.combatHeroAttack();const next=A.exportState();A.setLocalHeroId('mage');D.renderCombat();B.applyState(await push(next));check(anim().getState().skin==='worn-crimson'&&anim().getState().speed===2&&!material().surfacePack);});
await test('Enemy rank color and x2 speed reach the observer device',async()=>{A.setLocalHeroId('warrior');const random=a.Math.random;a.Math.random=()=>.5;try{D.getState().combat.phase='enemy_ready';D.combatEnemyTurn()}finally{a.Math.random=random}const next=A.exportState();A.setLocalHeroId('mage');D.renderCombat();check(next.combat.lastRoll.diceHeroId===null);B.applyState(await push(next));check(anim().getState().skin===b.RPGDiceSettings.resolveSkin(D.enemyDicePreferences())&&anim().getState().speed===2);});
const realPacks=b.FantasyDicePacks;
function delayedPack(){let loaded=false,release;const pending=new Promise(r=>{release=()=>{loaded=true;r(realPacks.list())}});b.FantasyDicePacks={...realPacks,get:id=>loaded?realPacks.get(id):null,refresh:()=>pending};return release}
let sequence=1000;
function stateFor(prefs=first.combat.lastRoll.dicePreferences){const state=clone(first);state.combat.lastRoll.seq=++sequence;state.combat.lastRoll.dicePreferences=clone(prefs);return state}
await test('Observer waits for texture instead of showing standard material on first load',async()=>{const release=delayedPack(),count=plays;B.applyState(stateFor());check(plays===count);release();await wait(20);check(plays===count+1&&material().surfacePack?.id==='studio-sample');b.FantasyDicePacks=realPacks;});
await test('A late texture cannot replace a newer roll',async()=>{const release=delayedPack(),count=plays;B.applyState(stateFor());B.applyState(stateFor({skin:'satin-red',pack:null,speed:2,motion:'roll'}));check(plays===count+1&&anim().getState().skin==='satin-red');release();await wait(20);check(plays===count+1&&anim().getState().skin==='satin-red');b.FantasyDicePacks=realPacks;});
await test('Closing combat while texture loads cancels pending presentation',async()=>{const release=delayedPack(),count=plays;B.applyState(stateFor());B.hideCombatWindow();release();await wait(20);check(plays===count);b.FantasyDicePacks=realPacks;});
await test('Legacy saves without dice snapshot remain readable',async()=>{const old=stateFor();delete old.combat.lastRoll.dicePreferences;B.applyState(old);B.showCombatWindow();check(anim().getState().skin==='classic');});
progress.textContent='DONE '+results.filter(x=>x.pass).length+'/'+results.length;report.textContent=JSON.stringify({finished:true,results},null,2);
})().catch(e=>{progress.textContent='SETUP ERROR';report.textContent=e.stack});
</script></html>
