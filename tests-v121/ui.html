<!doctype html><meta charset="utf-8"><pre id="report">Running</pre><iframe id="game" width="1200" height="850"></iframe><script>
(async()=>{const q=new URLSearchParams(location.search);game.width=q.get('w')||1200;game.height=q.get('h')||850;const results=[],check=(v,m)=>{if(!v)throw Error(m)},test=async(n,f)=>{try{await f();results.push([n,'PASS'])}catch(e){results.push([n,e.stack])}report.textContent=JSON.stringify(results,null,2)};
await new Promise(r=>{game.onload=r;game.src='../index.html?test121=1'});const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__;d.querySelector('#netLocal').click();D.setState(D.freshState());D.startGame(['warrior']);const p=D.currentPlayer();
await test('Enemy immunity row: level / immunity / health',()=>{D.combatStart(D.CARD_BY_ID[28]);D.cancelCombatAuto();const t=d.querySelector('.enemy-back').textContent;check(t.indexOf('Уровень')<t.indexOf('Иммунитет')&&t.indexOf('Иммунитет')<t.indexOf('Здоровье'),'row order');check(t.includes('Яд, Кровотечение, Горение'),'immunities')});
await test('Enemy without immunities: Нет',()=>{D.combatStart(D.CARD_BY_ID[1]);D.cancelCombatAuto();check(d.querySelector('.enemy-back').textContent.includes('ИммунитетНет'),'missing Нет')});
await test('Amulet selection opens from combat',()=>{D.setSlotId(p,'amulet',248);p.statuses=['Яд','Слабость'];d.querySelector('#sheetDrawer').hidden=true;D.useCleansingAmulet(p,{where:'equipment',slot:'amulet'});check(!d.querySelector('#sheetDrawer').hidden,'drawer hidden');check(d.querySelectorAll('#amuletCleanseChoices button').length===3,'choices');check(!p.itemUsage[248],'attempt consumed before choosing')});
await test('Sixteen potion illustrations load',async()=>{for(const id of [453, 457, 459, 460, 464, 466, 467, 469, 471, 473, 475, 477, 479, 481, 483, 485]){await new Promise((res,rej)=>{const img=new w.Image();img.onload=()=>{try{check(img.naturalWidth===img.naturalHeight,'square');res()}catch(e){rej(e)}};img.onerror=rej;img.src='../assets/items/'+id+'.png'})}});
report.dataset.done='true';})();</script>
