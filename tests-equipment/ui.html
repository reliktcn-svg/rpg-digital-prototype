<!doctype html><meta charset="utf-8"><title>Проверка v0.6.115</title><style>body{font:16px system-ui}pre{white-space:pre-wrap}iframe{border:0}</style><h1 id="progress">Проверка…</h1><pre id="report"></pre><iframe id="game" width="390" height="844"></iframe><script>
(async()=>{const results=[],check=(x,m='assertion')=>{if(!x)throw Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.message})}report.textContent=JSON.stringify(results,null,2)}
await new Promise(r=>{game.onload=r;game.src='../index.html?release115test=1'});const w=game.contentWindow,d=w.document,D=w.__RPG_DEBUG__;await wait(600);d.querySelector('#netLocal').click();D.startGame(['paladin']);let s=D.getState(),p=D.currentPlayer();
await test('Embedded abilities: no HTML request, loader or warning',async()=>{check(w.RPGProgression&&w.RPG_HERO_ATLAS.characters.length===6);await wait(5500);check(!d.querySelector('#atlasLoadNotice'));check(!w.performance.getEntriesByType('resource').some(r=>decodeURI(r.name).includes('Атлас героев.html')));check(!d.querySelector('script[src*="hero-atlas-loader"]'))});
await test('Paladin can equip every explicitly permitted armor and shield',()=>{const list=Object.values(D.CARD_BY_ID).filter(c=>c.category==='Броня и щиты'&&c.fields['Для кого'].includes('Паладин'));check(list.length>=30);for(const c of list)check(D.canEquipCard(p,c).ok,c.name)});
await test('Character sheet and ability tree at desktop and mobile widths',async()=>{for(const [width,height] of [[1440,900],[390,844],[320,568]]){game.width=width;game.height=height;D.openCharacterSheet();await wait(150);check(!d.querySelector('#sheetDrawer').hidden);check(d.querySelector('#sheetContent').textContent.includes('Паладин'));D.openHeroProgression(p.id);await wait(100);const tree=d.querySelector('.skill-tree-dialog');check(tree.open);check(tree.querySelectorAll('[data-skill]').length>15);const box=tree.getBoundingClientRect();check(box.width<=width&&box.height<=height);tree.querySelector('[data-skill]').click();check(d.querySelector('.skill-detail-dialog').open);d.querySelector('.skill-detail-dialog [data-close]').click();tree.querySelector('[data-close]').click();D.closeCharacterSheet()}});
await test('Blood armor after damage: visible action and continue button',async()=>{D.combatStart(D.CARD_BY_ID[1]);D.cancelCombatAuto();D.setSlotId(p,'armor',343);p.currentHp=10;p.maxHp=20;s.combat.phase='enemy_damage';s.combat.pendingEnemyDamage={amount:2};D.acceptEnemyDamage();D.cancelCombatAuto();check(d.querySelector('#modalContent').textContent.includes('Доспех Живой Крови'));check(d.querySelector('#combatContinueAfterDamage'));});
progress.textContent=results.every(x=>x.pass)?'PASS '+results.length:'FAIL';})();</script>
